<!DOCTYPE html>
<html lang="ar" dir="rtl" id="htmlTag">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac for building maintenance</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;900&display=swap');
        
        :root {
            --bg-deep: #ffffff;
            --surface: #f8fafc;
            --surface-card: #ffffff;
            --accent: #1e3a8a;
            --accent-glow: rgba(30, 58, 138, 0.15);
            --accent-hover: #1e40af;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --border-focus: #1e3a8a;
            --radius: 16px;
        }

        body {
            font-family: 'Tajawal', sans-serif;
            background-color: var(--bg-deep);
            color: var(--text-main);
            margin: 0;
            padding: 40px 20px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
        }

        .form-container {
            width: 100%;
            max-width: 820px;
            background: var(--surface);
            border-radius: var(--radius);
            box-shadow: 0 15px 35px -5px rgba(0, 0, 0, 0.08);
            border: 1.5px solid var(--border);
            padding: 45px;
            box-sizing: border-box;
            position: relative;
            overflow: hidden;
        }

        .form-container::before {
            content: '';
            position: absolute;
            top: 0; right: 0; left: 0;
            height: 4px;
            background: linear-gradient(90deg, #1e3a8a, #3b82f6);
        }

        .lang-switcher {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            margin-bottom: 20px;
        }

        .lang-btn {
            background: var(--surface-card);
            border: 1.5px solid var(--border);
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: inherit;
        }

        .lang-btn.active, .lang-btn:hover {
            background: #1e3a8a;
            color: #ffffff;
            border-color: #1e3a8a;
        }

        .brand-header {
            text-align: center;
            margin-bottom: 35px;
        }

        .brand-logo-text {
            font-size: 1.8rem;
            font-weight: 900;
            color: #1e3a8a;
            letter-spacing: 1px;
            margin-bottom: 6px;
        }

        .brand-header p {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin: 0;
            font-weight: 500;
        }

        .section-title {
            font-size: 1.05rem;
            font-weight: 700;
            color: #1e3a8a;
            border-bottom: 1.5px solid var(--border);
            padding-bottom: 8px;
            margin: 30px 0 20px 0;
            letter-spacing: 0.5px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 22px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 9px;
        }

        .form-group.full-width {
            grid-column: span 2;
        }

        label {
            font-size: 0.88rem;
            font-weight: 700;
            color: var(--text-main);
        }

        input, select, textarea {
            width: 100%;
            padding: 14px 16px;
            border: 1.5px solid var(--border);
            border-radius: 12px;
            font-size: 0.95rem;
            background: var(--surface-card);
            color: var(--text-main);
            font-family: inherit;
            outline: none;
            box-sizing: border-box;
            transition: all 0.25s ease;
        }

        input::placeholder, textarea::placeholder {
            color: #94a3b8;
        }

        input:focus, select:focus, textarea:focus {
            border-color: var(--border-focus);
            background: #ffffff;
            box-shadow: 0 0 0 4px var(--accent-glow);
        }

        select option {
            background-color: #ffffff;
            color: var(--text-main);
        }

        .file-upload-wrapper {
            position: relative;
            border: 2px dashed var(--border);
            border-radius: 12px;
            padding: 24px;
            text-align: center;
            background: var(--surface-card);
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .file-upload-wrapper:hover {
            border-color: var(--accent);
            background: rgba(30, 58, 138, 0.02);
        }

        .file-upload-wrapper input[type="file"] {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            opacity: 0;
            cursor: pointer;
        }

        .file-upload-text {
            color: var(--text-muted);
            font-size: 0.9rem;
            font-weight: 500;
        }

        .submit-btn {
            background: linear-gradient(135deg, #1e3a8a, #1e40af);
            color: #fff;
            border: none;
            width: 100%;
            padding: 16px;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            font-family: inherit;
            margin-top: 35px;
            transition: all 0.3s ease;
            box-shadow: 0 10px 20px -5px rgba(30, 58, 138, 0.25);
        }

        .submit-btn:hover {
            background: linear-gradient(135deg, #1e40af, #1d4ed8);
            transform: translateY(-2px);
            box-shadow: 0 15px 25px -5px rgba(30, 58, 138, 0.35);
        }

        .support-footer {
            margin-top: 40px;
            border-top: 1.5px solid var(--border);
            padding-top: 25px;
            text-align: center;
        }

        .support-footer h3 {
            font-size: 1.1rem;
            color: #1e3a8a;
            margin-bottom: 12px;
            font-weight: 700;
        }

        .support-contacts {
            display: flex;
            justify-content: center;
            gap: 30px;
            flex-wrap: wrap;
        }

        .support-item {
            font-size: 0.95rem;
            color: var(--text-muted);
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .support-item a {
            color: #1e3a8a;
            text-decoration: none;
            transition: color 0.2s;
        }

        .support-item a:hover {
            color: #3b82f6;
            text-decoration: underline;
        }

        @media (max-width: 768px) {
            .form-grid { grid-template-columns: 1fr; }
            .form-group.full-width { grid-column: span 1; }
            .form-container { padding: 25px; }
            .support-contacts { flex-direction: column; gap: 10px; }
        }
    </style>
</head>

<div class="form-container">
    <div class="lang-switcher">
        <button type="button" class="lang-btn active" onclick="setLanguage('ar', event)">عربي</button>
        <button type="button" class="lang-btn" onclick="setLanguage('en', event)">English</button>
        <button type="button" class="lang-btn" onclick="setLanguage('ur', event)">اردو</button>
    </div>

    <div class="brand-header">
        <h1 class="brand-logo-text">Tic Tac for building maintenance</h1>
        <p id="subHeader">طلب انضمام لفريق العمل - دولة قطر</p>
    </div>

    <form id="jobForm" onsubmit="submitApplication(event)">

                    <option value="ذكر" data-i18n="optMale">ذكر</option>
                    <option value="أنثى" data-i18n="optFemale">أنثى</option>
                </select>
            </div>

            <div class="form-group">
                <label data-i18n="lblNationality">الجنسية</label>

                    <option value="هندي">هندي / Indian</option>
                    <option value="باكستاني">باكستاني / Pakistani</option>
                    <option value="بنغلاديشي">بنغلاديشي / Bangladeshi</option>
                    <option value="نيبالي">نيبالي / Nepalese</option>
                    <option value="سوداني">سوداني / Sudanese</option>
                    <option value="سوري">سوري / Syrian</option>
                    <option value="أردني">أردني / Jordanian</option>
                    <option value="فلسطيني">فلسطيني / Palestinian</option>
                    <option value="لبناني">لبناني / Lebanese</option>
                    <option value="يمني">يمني / Yemeni</option>
                    <option value="فلبيني">فلبيني / Filipino</option>
                    <option value="سريلانكي">سريلانكي / Sri Lankan</option>
                    <option value="تونسى">تونسى / Tunisian</option>
                    <option value="مغربي">مغربي / Moroccan</option>
                    <option value="جزائري">جزائري / Algerian</option>
                    <option value="أخرى">أخرى / Other</option>
                </select>
            </div>
        </div>

        <div class="section-title" data-i18n="secContact">بيانات التواصل</div>

            <div class="form-group">

                    <option value="فني كهرباء مباني وكابلات">فني كهرباء مباني وكابلات / Building Electrician</option>

                    <option value="مساعد فني / عامل عادي">مساعد فني / عامل عادي / Assistant / General Labour</option>
                    <option value="أخرى">أخرى / Other</option>

                    <option value="بدون رخصة قيادة" data-i18n="lic4">بدون رخصة قيادة</option>
                </select>
            </div>

            <div class="form-group">
                <label data-i18n="lblCar">توفر السيارة</label>
                <select id="hasCar" required>
                    <option value="" data-i18n="optCarDefault">هل تمتلك سيارة خاصة؟</option>
                    <option value="نعم، أمتلك سيارة خاصة" data-i18n="carYes">نعم، أمتلك سيارة خاصة</option>
                    <option value="لا، لا أمتلك سيارة" data-i18n="carNo">لا، لا أمتلك سيارة</option>
                </select>
            </div>

            <div class="form-group">
                <label data-i18n="lblCv">السيرة الذاتية (CV)</label>
                <div class="file-upload-wrapper">
                    <span class="file-upload-text" id="fileNameDisplay" data-i18n="cvText">اختر ملف السيرة الذاتية (PDF, DOC)</span>
                    <input type="file" id="cvFile" accept=".pdf,.doc,.docx" onchange="updateFileName(this)">
                </div>
            </div>

            <div class="form-group full-width">
                <label data-i18n="lblExp">نبذة عن الخبرة السابقة</label>
                <textarea id="experience" rows="3" data-i18n-placeholder="phExp" placeholder="اكتب ملخص سريع لخبراتك السابقة في قطاع المقاولات والصيانة..."></textarea>
            </div>
        </div>

        <button type="submit" class="submit-btn" id="submitBtn" data-i18n="btnSubmit">إرسال الطلب الآن</button>
    </form>

    <div class="support-footer">
        <h3 data-i18n="supportTitle">للتواصل والدعم الفني</h3>
        <div class="support-contacts">
            <div class="support-item">
                <span data-i18n="supportPhone">📞 الهاتف / واتساب:</span>

            </div>
            <div class="support-item">
                <span data-i18n="supportEmail">✉️ البريد الإلكتروني:</span>
                <a href="mailto:Tictac.qatar@gmail.com">Tictac.qatar@gmail.com</a>
            </div>
        </div>
    </div>
</div>

    let currentLang = 'ar';

    function setLanguage(lang, event) {
        currentLang = lang;
        const t = translations[lang];
        
        document.getElementById('htmlTag').setAttribute('lang', lang);
        document.getElementById('htmlTag').setAttribute('dir', t.dir);

        document.querySelectorAll('.lang-btn').forEach(btn => {
            btn.classList.remove('active');
        });
        if (event && event.target) {
            event.target.classList.add('active');
        }

        document.getElementById('subHeader').textContent = t.subHeader;

        document.querySelectorAll('[data-i18n]').forEach(el => {
            const key = el.getAttribute('data-i18n');
            if (t[key]) {
                el.textContent = t[key];
            }
        });

        document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
            const key = el.getAttribute('data-i18n-placeholder');
            if (t[key]) {
                el.placeholder = t[key];
            }
        });
    }

    function updateFileName(input) {
        const display = document.getElementById('fileNameDisplay');
        const t = translations[currentLang];
        if (input.files.length > 0) {
            display.textContent = t.fileAttached + input.files[0].name;
            display.style.color = "#1e3a8a";
            display.style.fontWeight = "700";
        }
    }

    async function submitApplication(e) {
        e.preventDefault();
        const t = translations[currentLang];
        const btn = document.getElementById('submitBtn');
        btn.disabled = true;
        btn.textContent = t.sendingText;

        const fileInput = document.getElementById('cvFile');
        let cvData = '';
        let cvName = '';
        if (fileInput.files.length > 0) {
            const file = fileInput.files[0];
            cvName = file.name;
            cvData = await new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result);
                reader.readAsDataURL(file);
            });
        }

        const emailVal = document.getElementById('email').value;
        const phoneVal = document.getElementById('phone').value;
        const contactInfo = `الهاتف: ${phoneVal} | الإيميل: ${emailVal}`;
        const qatarDetails = `الإقامة: ${document.getElementById('iqamaStatus').value} | الرخصة: ${document.getElementById('licenseStatus').value} | السيارة: ${document.getElementById('hasCar').value}`;

        const newApplicant = {
            name: document.getElementById('name').value,
            age: document.getElementById('age').value,
            gender: document.getElementById('gender').value,
            nationality: document.getElementById('nationality').value,
            phone: contactInfo, 
            position: document.getElementById('position').value,
            experience: document.getElementById('experience').value,
            qatarId: qatarDetails,
            cvData: cvData,
            cvName: cvName,
            date: new Date().toISOString()
        };

        try {
            await fetch(WEB_APP_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify(newApplicant)
            });
            alert(t.msgSuccess);
            document.getElementById('jobForm').reset();
            document.getElementById('fileNameDisplay').textContent = t.cvText;
            document.getElementById('fileNameDisplay').style.color = 'var(--text-muted)';
        } catch (error) {
            alert(t.msgError);
        } finally {
            btn.disabled = false;
            btn.textContent = t.btnSubmit;
        }
    }
</script>
