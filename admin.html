<!DOCTYPE html>
<html lang="ar" dir="rtl" id="adminHtml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - tic tac</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');

        :root {
            --primary: #0f172a;
            --accent: #2563eb;
            --bg-body: #f1f5f9;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --radius: 16px;
            --shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.05);
        }

        body {
            font-family: 'Lusail Plus', 'Tajawal', 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            margin: 0;
            padding: 30px 20px;
        }

        .admin-wrapper {
            max-width: 1350px;
            margin: 0 auto;
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            padding: 30px;
        }

        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--border);
            padding-bottom: 20px;
            margin-bottom: 25px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .admin-header h1 {
            font-size: 1.3rem;
            margin: 0;
            color: var(--primary);
            font-weight: 700;
        }

        .lang-switcher {
            display: flex;
            background: #f1f5f9;
            padding: 4px;
            border-radius: 10px;
            gap: 4px;
        }

        .lang-btn {
            background: transparent;
            color: var(--text-muted);
            border: none;
            padding: 6px 14px;
            border-radius: 7px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            transition: all 0.2s;
        }

        .lang-btn.active {
            background: var(--primary);
            color: #fff;
        }

        .filters-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            background: #f8fafc;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid var(--border);
            margin-bottom: 25px;
        }

        .filter-box label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-muted);
        }

        .filter-box select {
            width: 100%;
            padding: 10px 14px;
            border: 1.5px solid var(--border);
            border-radius: 8px;
            font-size: 0.9rem;
            background: #fff;
            font-family: inherit;
        }

        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: right;
        }

        [dir="ltr"] table {
            text-align: left;
        }

        th, td {
            padding: 15px;
            border-bottom: 1px solid var(--border);
            font-size: 0.9rem;
        }

        th {
            background: #f8fafc;
            color: var(--text-muted);
            font-weight: 600;
        }

        .badge-position {
            background: #eff6ff;
            color: #1e40af;
            padding: 4px 10px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.8rem;
            display: inline-block;
        }

        .phone-highlight {
            font-weight: bold;
            color: var(--accent);
        }

        .no-data {
            text-align: center;
            padding: 30px;
            color: var(--text-muted);
            font-weight: 500;
        }

        @media(max-width: 768px) {
            .filters-container { grid-template-columns: 1fr; }
            .admin-wrapper { padding: 15px; }
        }
    </style>
</head>
<body>

<div class="admin-wrapper">
    <div class="admin-header">
        <h1 id="admTitle">لوحة التحكم الإدارية - tic tac</h1>
        <div class="lang-switcher">
            <button class="lang-btn active" onclick="switchAdminLang('ar')" id="aAr">عربي</button>
            <button class="lang-btn" onclick="switchAdminLang('en')" id="aEn">English</button>
            <button class="lang-btn" onclick="switchAdminLang('ur')" id="aUr">اردو</button>
        </div>
    </div>

    <div class="filters-container">
        <div class="filter-box">
            <label id="lblFilterNat">تصفية حسب الجنسية</label>
            <select id="filterNat" onchange="renderTable()">
                <option value="">جميع الجنسيات</option>
                <option value="Egyptian">مصري</option>
                <option value="Indian">هندي</option>
                <option value="Nepalese">نيبالي</option>
                <option value="Pakistani">باكستاني</option>
                <option value="Bangladeshi">بنجلاديشي</option>
                <option value="Filipino">فلبيني</option>
            </select>
        </div>
        <div class="filter-box">
            <label id="lblFilterPos">تصفية حسب الوظيفة</label>
            <select id="filterPos" onchange="renderTable()">
                <option value="">جميع الوظائف</option>
                <option value="Electrician">فني كهرباء</option>
                <option value="Plumber">فني سباكة</option>
                <option value="Site Engineer">مهندس موقع</option>
                <option value="Project Manager">مدير مشروع</option>
            </select>
        </div>
        <div class="filter-box">
            <label id="lblFilterAge">تصفية حسب الفئة العمرية</label>
            <select id="filterAge" onchange="renderTable()">
                <option value="">جميع الأعمار</option>
                <option value="20-30">20 - 30 سنة</option>
                <option value="31-40">31 - 40 سنة</option>
                <option value="41+">41 سنة فأكثر</option>
            </select>
        </div>
    </div>

    <div class="table-container">
        <table id="applicantsTable">
            <thead>
                <tr>
                    <th id="thName">الاسم</th>
                    <th id="thAge">العمر</th>
                    <th id="thNat">الجنسية</th>
                    <th id="thPhone">رقم التواصل</th>
                    <th id="thPos">الوظيفة</th>
                    <th id="thExp">نبذة الخبرة</th>
                    <th id="thStatus">إقامة / رخصة / سيارة</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <!-- سيتم تعبئة البيانات تلقائياً هنا -->
            </tbody>
        </table>
    </div>
</div>

<script>
    const adminDict = {
        ar: {
            title: "لوحة التحكم الإدارية - tic tac",
            fNat: "تصفية حسب الجنسية",
            fPos: "تصفية حسب الوظيفة",
            fAge: "تصفية حسب الفئة العمرية",
            thName: "الاسم", thAge: "العمر", thNat: "الجنسية", thPhone: "رقم التواصل",
            thPos: "الوظيفة", thExp: "نبذة الخبرة", thStatus: "إقامة / رخصة / سيارة",
            noData: "لا توجد طلبات مسجلة حتى الآن."
        },
        en: {
            title: "Admin Dashboard - tic tac",
            fNat: "Filter by Nationality",
            fPos: "Filter by Position",
            fAge: "Filter by Age Group",
            thName: "Name", thAge: "Age", thNat: "Nationality", thPhone: "Contact",
            thPos: "Position", thExp: "Experience", thStatus: "Res / Lic / Car",
            noData: "No applications registered yet."
        },
        ur: {
            title: "ایڈمن ڈیش بورڈ - tic tac",
            fNat: "قومیت کے لحاظ سے فلٹر کریں",
            fPos: "عہدے کے لحاظ سے فلٹر کریں",
            fAge: "عمر کے لحاظ سے فلٹر کریں",
            thName: "نام", thAge: "عمر", thNat: "قومیت", thPhone: "رابطہ نمبر",
            thPos: "عہدہ", thExp: "تجربہ", thStatus: "اقامہ / لائسنس / گاڑی",
            noData: "ابھی تک کوئی درخواست درج نہیں ہے۔"
        }
    };

    let currentLang = 'ar';

    function switchAdminLang(lang) {
        currentLang = lang;
        document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
        const html = document.getElementById('adminHtml');
        
        if(lang === 'ar') {
            html.setAttribute('lang', 'ar');
            html.setAttribute('dir', 'rtl');
            document.getElementById('aAr').classList.add('active');
        } else if(lang === 'en') {
            html.setAttribute('lang', 'en');
            html.setAttribute('dir', 'ltr');
            document.getElementById('aEn').classList.add('active');
        } else {
            html.setAttribute('lang', 'ur');
            html.setAttribute('dir', 'rtl');
            document.getElementById('aUr').classList.add('active');
        }

        const t = adminDict[lang];
        document.getElementById('admTitle').innerText = t.title;
        document.getElementById('lblFilterNat').innerText = t.fNat;
        document.getElementById('lblFilterPos').innerText = t.fPos;
        document.getElementById('lblFilterAge').innerText = t.fAge;
        document.getElementById('thName').innerText = t.thName;
        document.getElementById('thAge').innerText = t.thAge;
        document.getElementById('thNat').innerText = t.thNat;
        document.getElementById('thPhone').innerText = t.thPhone;
        document.getElementById('thPos').innerText = t.thPos;
        document.getElementById('thExp').innerText = t.thExp;
        document.getElementById('thStatus').innerText = t.thStatus;

        renderTable();
    }

    function getAgeGroup(age) {
        const num = parseInt(age);
        if (num >= 20 && num <= 30) return '20-30';
        if (num >= 31 && num <= 40) return '31-40';
        if (num >= 41) return '41+';
        return '';
    }

    function renderTable() {
        const tableBody = document.getElementById('tableBody');
        const applicants = JSON.parse(localStorage.getItem('ticTacApplicants')) || [];
        
        const natFilter = document.getElementById('filterNat').value;
        const posFilter = document.getElementById('filterPos').value;
        const ageFilter = document.getElementById('filterAge').value;

        tableBody.innerHTML = '';

        const filtered = applicants.filter(app => {
            const ageGrp = getAgeGroup(app.age);
            const matchN = !natFilter || app.nationality === natFilter;
            const matchP = !posFilter || app.position === posFilter;
            const matchA = !ageFilter || ageGrp === ageFilter;
            return matchN && matchP && matchA;
        });

        if (filtered.length === 0) {
            tableBody.innerHTML = `<tr><td colspan="7" class="no-data">${adminDict[currentLang].noData}</td></tr>`;
            return;
        }

        filtered.forEach(app => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td><strong>${app.name}</strong></td>
                <td>${app.age}</td>
                <td>${app.nationality}</td>
                <td class="phone-highlight">${app.phone}</td>
                <td><span class="badge-position">${app.position}</span></td>
                <td>${app.experience || '-'}</td>
                <td>${app.qatarId} / ${app.license} / ${app.car}</td>
            `;
            tableBody.appendChild(tr);
        });
    }

    // تحميل البيانات عند فتح الصفحة
    window.onload = renderTable;
</script>
</body>
</html>
