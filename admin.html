<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم الإدارية - TIC TAC</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');

        :root {
            --primary: #0f172a;
            --accent: #2563eb;
            --bg-body: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --radius: 20px;
            --shadow: 0 20px 25px -5px rgba(15, 23, 42, 0.05);
            --transition: all 0.25s ease;
        }

        body {
            font-family: 'Tajawal', 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            margin: 0;
            padding: 40px 20px;
        }

        .admin-wrapper {
            max-width: 1550px;
            margin: 0 auto;
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            padding: 35px;
        }

        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            padding-bottom: 25px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 20px;
        }

        .admin-header h1 {
            font-size: 1.5rem;
            margin: 0;
            color: var(--primary);
            font-weight: 800;
        }

        .filters-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            background: #f8fafc;
            padding: 25px;
            border-radius: 16px;
            border: 1px solid var(--border);
            margin-bottom: 30px;
        }

        .filter-box label {
            display: block;
            font-size: 0.85rem;
            font-weight: 700;
            margin-bottom: 10px;
            color: var(--text-muted);
        }

        .filter-box select {
            width: 100%;
            padding: 12px 16px;
            border: 1.5px solid var(--border);
            border-radius: 10px;
            font-size: 0.9rem;
            background: #fff;
            font-family: inherit;
            outline: none;
            cursor: pointer;
        }

        .table-container {
            overflow-x: auto;
            border-radius: 12px;
            border: 1px solid var(--border);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: right;
            white-space: nowrap;
        }

        th, td {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border);
            font-size: 0.9rem;
        }

        th {
            background: #f8fafc;
            color: var(--text-muted);
            font-weight: 700;
            text-transform: uppercase;
            font-size: 0.75rem;
        }

        tr:hover td {
            background-color: #fafbfc;
        }

        .badge-position {
            background: #eff6ff;
            color: #1d4ed8;
            padding: 6px 12px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.8rem;
            display: inline-block;
            border: 1px solid #dbeafe;
        }

        .phone-highlight {
            font-weight: 700;
            color: var(--accent);
        }

        .cv-link {
            background: var(--primary);
            color: #fff;
            padding: 8px 14px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 0.8rem;
            font-weight: 700;
            display: inline-block;
        }

        .no-cv {
            color: var(--text-muted);
            font-style: italic;
        }

        .actions-cell {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .status-select {
            padding: 8px 14px;
            border-radius: 10px;
            border: 1.5px solid var(--border);
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
        }

        .status-green { background-color: #ecfdf5; color: #047857; border-color: #a7f3d0; }
        .status-yellow { background-color: #fffbeb; color: #b45309; border-color: #fde68a; }
        .status-red { background-color: #fef2f2; color: #b91c1c; border-color: #fecaca; }

        .btn-delete {
            background: #fef2f2;
            color: #b91c1c;
            border: 1px solid #fecaca;
            padding: 8px 14px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 700;
        }

        .no-data {
            text-align: center;
            padding: 50px;
            color: var(--text-muted);
            font-weight: 600;
        }
    </style>
</head>
<body>

<div class="admin-wrapper">
    <div class="admin-header">
        <h1>لوحة التحكم الإدارية - TIC TAC</h1>
    </div>

    <div class="filters-container">
        <div class="filter-box">
            <label>تصفية حسب الجنس</label>
            <select id="filterGender" onchange="renderTable()">
                <option value="">جميع الأجناس</option>
                <option value="ذكر">ذكر</option>
                <option value="أنثى">أنثى</option>
            </select>
        </div>
        <div class="filter-box">
            <label>تصفية حسب الجنسية</label>
            <select id="filterNat" onchange="renderTable()">
                <option value="">جميع الجنسيات</option>
                <option value="مصري">مصري</option>
                <option value="هندي">هندي</option>
                <option value="باكستاني">باكستاني</option>
                <option value="سوداني">سوداني</option>
                <option value="سوري">سوري</option>
                <option value="أردني">أردني</option>
                <option value="جنسية أخرى">جنسية أخرى</option>
            </select>
        </div>
        <div class="filter-box">
            <label>تصفية حسب الوظيفة</label>
            <select id="filterPos" onchange="renderTable()">
                <option value="">جميع الوظائف</option>
                <option value="فني كهرباء">فني كهرباء</option>
                <option value="فني تكييف (HVAC)">فني تكييف (HVAC)</option>
                <option value="فني سباكة وصحي">فني سباكة وصحي</option>
                <option value="مشرف صيانة عامة">مشرف صيانة عامة</option>
                <option value="مهندس موقع">مهندس موقع</option>
            </select>
        </div>
        <div class="filter-box">
            <label>تصفية حسب الفئة العمرية</label>
            <select id="filterAge" onchange="renderTable()">
                <option value="">جميع الأعمار</option>
                <option value="20-30">20 - 30 سنة</option>
                <option value="31-40">31 - 40 سنة</option>
                <option value="41+">41 سنة فأكثر</option>
            </select>
        </div>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>الاسم</th>
                    <th>العمر</th>
                    <th>الجنس</th>
                    <th>الجنسية</th>
                    <th>رقم التواصل</th>
                    <th>الوظيفة</th>
                    <th>نبذة الخبرة</th>
                    <th>السيرة الذاتية</th>
                    <th>إقامة / رخصة / سيارة</th>
                    <th>إجراءات المتابعة</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <tr><td colspan="10" class="no-data">جاري تحميل البيانات من السحابة...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    const BIN_ID = '6738917facd3cb3488f54311';
    let globalApplicants = [];

    function getAgeGroup(age) {
        const num = parseInt(age);
        if (num >= 20 && num <= 30) return '20-30';
        if (num >= 31 && num <= 40) return '31-40';
        if (num >= 41) return '41+';
        return '';
    }

    async function fetchCloudData() {
        try {
            let response = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
                headers: { 'X-Master-Key': '$2a$10$vNqjH1/K9sXz7m3gXvW8UeR8xQ8ZqQyqYq8xQ8ZqQyqYq8xQ8ZqQy' }
            });
            let data = await response.json();
            globalApplicants = data.record || [];
        } catch (e) {
            globalApplicants = JSON.parse(localStorage.getItem('ticTacApplicants')) || [];
        }
        renderTable();
    }

    async function saveCloudData(applicants) {
        globalApplicants = applicants;
        localStorage.setItem('ticTacApplicants', JSON.stringify(applicants));
        try {
            await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                    'X-Master-Key': '$2a$10$vNqjH1/K9sXz7m3gXvW8UeR8xQ8ZqQyqYq8xQ8ZqQyqYq8xQ8ZqQy'
                },
                body: JSON.stringify(applicants)
            });
        } catch (e) {
            console.log("خطأ في التحديث السحابي");
        }
    }

    function updateStatus(index, value) {
        globalApplicants[index].status = value;
        saveCloudData(globalApplicants);
        renderTable();
    }

    function deleteApplicant(index) {
        if(confirm('هل أنت متأكد من حذف هذا الطلب؟')) {
            globalApplicants.splice(index, 1);
            saveCloudData(globalApplicants);
            renderTable();
        }
    }

    function renderTable() {
        const tableBody = document.getElementById('tableBody');
        const genderFilter = document.getElementById('filterGender').value;
        const natFilter = document.getElementById('filterNat').value;
        const posFilter = document.getElementById('filterPos').value;
        const ageFilter = document.getElementById('filterAge').value;

        tableBody.innerHTML = '';

        const filtered = globalApplicants.map((app, originalIndex) => ({ app, originalIndex })).filter(({ app }) => {
            const ageGrp = getAgeGroup(app.age);
            const matchG = !genderFilter || app.gender === genderFilter;
            const matchN = !natFilter || app.nationality === natFilter;
            const matchP = !posFilter || app.position === posFilter;
            const matchA = !ageFilter || ageGrp === ageFilter;
            return matchG && matchN && matchP && matchA;
        });

        if (filtered.length === 0) {
            tableBody.innerHTML = `<tr><td colspan="10" class="no-data">لا توجد طلبات مطابقة أو مسجلة حتى الآن.</td></tr>`;
            return;
        }

        filtered.forEach(({ app, originalIndex }) => {
            let cvCell = `<span class="no-cv">لا يوجد</span>`;
            if (app.cvData) {
                cvCell = `<a href="${app.cvData}" download="${app.cvName || 'CV'}" class="cv-link">تحميل CV</a>`;
            }

            let statusClass = '';
            if (app.status === 'green') statusClass = 'status-green';
            else if (app.status === 'yellow') statusClass = 'status-yellow';
            else if (app.status === 'red') statusClass = 'status-red';

            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td><strong>${app.name}</strong></td>
                <td>${app.age}</td>
                <td>${app.gender || '-'}</td>
                <td>${app.nationality}</td>
                <td class="phone-highlight">${app.phone}</td>
                <td><span class="badge-position">${app.position}</span></td>
                <td>${app.experience || '-'}</td>
                <td>${cvCell}</td>
                <td>${app.qatarId || '-'}</td>
                <td>
                    <div class="actions-cell">
                        <select class="status-select ${statusClass}" onchange="updateStatus(${originalIndex}, this.value)">
                            <option value="" ${!app.status ? 'selected' : ''}>اختر الحالة...</option>
                            <option value="green" ${app.status === 'green' ? 'selected' : ''}>🟢 مقبول</option>
                            <option value="yellow" ${app.status === 'yellow' ? 'selected' : ''}>🟡 قيد المراجعة</option>
                            <option value="red" ${app.status === 'red' ? 'selected' : ''}>🔴 مرفوض</option>
                        </select>
                        <button class="btn-delete" onclick="deleteApplicant(${originalIndex})">حذف</button>
                    </div>
                </td>
            `;
            tableBody.appendChild(tr);
        });
    }

    // جلب البيانات عند فتح الصفحة والتحديث التلقائي كل 5 ثوانٍ
    window.onload = function() {
        fetchCloudData();
        setInterval(fetchCloudData, 5000);
    };
</script>
</body>
</html>
