<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم الإدارية - TIC TAC</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap');
        :root {
            --primary: #0f172a; --accent: #3b82f6; --accent-hover: #2563eb;
            --bg-body: #f1f5f9; --card-bg: #ffffff; --text-main: #334155;
            --text-muted: #64748b; --border: #e2e8f0; --radius: 16px;
            --shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.04);
        }
        body { font-family: 'Tajawal', sans-serif; background-color: var(--bg-body); color: var(--text-main); margin: 0; padding: 30px 20px; }
        .admin-wrapper { max-width: 1550px; margin: 0 auto; background: var(--card-bg); border-radius: var(--radius); box-shadow: var(--shadow); border: 1.5px solid var(--border); padding: 30px; }
        .admin-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 20px; margin-bottom: 25px; flex-wrap: wrap; gap: 15px; }
        .admin-header h1 { font-size: 1.5rem; margin: 0; color: var(--primary); font-weight: 900; }
        .refresh-btn { background: var(--accent); color: #fff; border: none; padding: 10px 20px; border-radius: 12px; font-weight: 700; cursor: pointer; font-family: inherit; transition: background 0.2s; display: flex; align-items: center; gap: 8px; }
        .refresh-btn:hover { background: var(--accent-hover); }
        .filters-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; background: #f8fafc; padding: 20px; border-radius: var(--radius); border: 1.5px solid var(--border); margin-bottom: 25px; }
        .filter-group { display: flex; flex-direction: column; gap: 8px; }
        .filter-group label { font-size: 0.85rem; font-weight: 700; color: var(--text-muted); }
        .filter-group select { width: 100%; padding: 12px 14px; border: 1.5px solid var(--border); border-radius: 12px; font-size: 0.9rem; background: #fff; color: var(--text-main); font-family: inherit; outline: none; cursor: pointer; }
        .table-container { overflow-x: auto; border-radius: 12px; border: 1.5px solid var(--border); }
        table { width: 100%; border-collapse: collapse; text-align: right; white-space: nowrap; }
        th, td { padding: 15px 18px; border-bottom: 1px solid var(--border); font-size: 0.9rem; }
        th { background: #f8fafc; color: var(--text-muted); font-weight: 700; font-size: 0.8rem; }
        tr:hover td { background-color: #f8fafc; }
        .badge-position { background: #eff6ff; color: #1d4ed8; padding: 6px 12px; border-radius: 8px; font-weight: 700; font-size: 0.8rem; border: 1px solid #dbeafe; display: inline-block; }
        .phone-highlight { font-weight: 700; color: var(--accent); }
        .cv-link { background: var(--primary); color: #fff; padding: 7px 12px; border-radius: 8px; text-decoration: none; font-size: 0.8rem; font-weight: 700; display: inline-block; }
        .no-cv { color: var(--text-muted); font-style: italic; font-size: 0.85rem; }
        .no-data { text-align: center; padding: 50px; color: var(--text-muted); font-weight: 600; }
    </style>
</head>
<body>
<div class="admin-wrapper">
    <div class="admin-header">
        <h1>لوحة التحكم الإدارية - TIC TAC</h1>
        <button class="refresh-btn" onclick="fetchData()"><span>🔄 تحديث البيانات الآن</span></button>
    </div>
    <div class="filters-container">
        <div class="filter-group"><label>تصفية حسب الجنس</label><select id="filterGender" onchange="renderTable()"><option value="">جميع الأجناس</option><option value="ذكر">ذكر</option><option value="أنثى">أنثى</option></select></div>
        <div class="filter-group">
            <label>تصفية حسب الجنسية</label>
            <select id="filterNat" onchange="renderTable()">
                <option value="">جميع الجنسيات</option>
                <option value="مصري">مصري</option>
                <option value="هندي">هندي</option>
                <option value="باكستاني">باكستاني</option>
                <option value="بنغلاديشي">بنغلاديشي</option>
                <option value="نيبالي">نيبالي</option>
                <option value="سوداني">سوداني</option>
                <option value="سوري">سوري</option>
                <option value="أردني">أردني</option>
                <option value="فلسطيني">فلسطيني</option>
                <option value="لبناني">لبناني</option>
                <option value="يمني">يمني</option>
                <option value="فلبيني">فلبيني</option>
                <option value="سريلانكي">سريلانكي</option>
                <option value="تونسى">تونسى</option>
                <option value="مغربي">مغربي</option>
                <option value="جزائري">جزائري</option>
                <option value="أخرى">أخرى</option>
            </select>
        </div>
        <div class="filter-group">
            <label>تصفية حسب الوظيفة</label>
            <select id="filterPos" onchange="renderTable()">
                <option value="">جميع الوظائف</option>
                <option value="فني كهرباء مباني وكابلات">فني كهرباء مباني وكابلات</option>
                <option value="فني تكييف وتبريد (HVAC)">فني تكييف وتبريد (HVAC)</option>
                <option value="فني سباكة وصحي">فني سباكة وصحي</option>
                <option value="فني لحام وتشكيل معادن">فني لحام وتشكيل معادن</option>
                <option value="فني نجارة وأبواب">فني نجارة وأبواب</option>
                <option value="فني دهانات وديكور">فني دهانات وديكور</option>
                <option value="فني جبس بورد وتزيين">فني جبس بورد وتزيين</option>
                <option value="فني ألمنيوم وواجهات زجاجية">فني ألمنيوم وواجهات زجاجية</option>
                <option value="فني بلاط ورخام (سيراميك)">فني بلاط ورخام (سيراميك)</option>
                <option value="فني مباني ولياسة (طوب وبلاستر)">فني مباني ولياسة (طوب وبلاستر)</option>
                <option value="مساعد فني / عامل عادي">مساعد فني / عامل عادي</option>
                <option value="سائق معدات ثقيلة / رخصة قطرية">سائق معدات ثقيلة / رخصة قطرية</option>
                <option value="سائق سيارة خفيفة / رخصة قطرية">سائق سيارة خفيفة / رخصة قطرية</option>
                <option value="مشرف صيانة عامة">مشرف صيانة عامة</option>
                <option value="مراقب عمال (فورمان)">مراقب عمال (فورمان)</option>
                <option value="مهندس موقع (مقاولات وصيانة)">مهندس موقع (مقاولات وصيانة)</option>
                <option value="أخرى">أخرى</option>
            </select>
        </div>
        <div class="filter-group"><label>تصفية حسب الفئة العمرية</label><select id="filterAge" onchange="renderTable()"><option value="">جميع الأعمار</option><option value="20-30">20 - 30 سنة</option><option value="31-40">31 - 40 سنة</option><option value="41+">41 سنة فأكثر</option></select></div>
    </div>
    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>الاسم</th><th>العمر</th><th>الجنس</th><th>الجنسية</th><th>رقم التواصل</th>
                    <th>الوظيفة</th><th>نبذة الخبرة</th><th>السيرة الذاتية</th><th>إقامة / رخصة / سيارة</th><th>تاريخ الطلب</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <tr><td colspan="10" class="no-data">جاري جلب الطلبات...</td></tr>
            </tbody>
        </table>
    </div>
</div>
<script>
    const WEB_APP_URL = 'ضع_رابط_الـ_Web_App_هنا';
    let globalApplicants = [];

    function getAgeGroup(age) {
        const num = parseInt(age);
        if (num >= 20 && num <= 30) return '20-30';
        if (num >= 31 && num <= 40) return '31-40';
        if (num >= 41) return '41+';
        return '';
    }

    async function fetchData() {
        try {
            let response = await fetch(WEB_APP_URL + '?t=' + new Date().getTime());
            let data = await response.json();
            globalApplicants = Array.isArray(data) ? data : [];
        } catch (e) {
            console.log("خطأ في جلب البيانات");
        }
        renderTable();
    }

    function renderTable() {
        const tableBody = document.getElementById('tableBody');
        const genderFilter = document.getElementById('filterGender').value;
        const natFilter = document.getElementById('filterNat').value;
        const posFilter = document.getElementById('filterPos').value;
        const ageFilter = document.getElementById('filterAge').value;

        tableBody.innerHTML = '';

        const filtered = globalApplicants.filter(app => {
            const ageGrp = getAgeGroup(app.age);
            const matchG = !genderFilter || app.gender === genderFilter;
            const matchN = !natFilter || app.nationality === natFilter;
            const matchP = !posFilter || app.position === posFilter;
            const matchA = !ageFilter || ageGrp === ageFilter;
            return matchG && matchN && matchP && matchA;
        });

        if (filtered.length === 0) {
            tableBody.innerHTML = `<tr><td colspan="10" class="no-data">لا توجد طلبات مسجلة حتى الآن.</td></tr>`;
            return;
        }

        filtered.forEach((app) => {
            let cvCell = `<span class="no-cv">لا يوجد</span>`;
            if (app.cvData) {
                cvCell = `<a href="${app.cvData}" download="${app.cvName || 'CV'}" class="cv-link">تحميل CV</a>`;
            }

            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td><strong>${app.name}</strong></td>
                <td>${app.age}</td>
                <td>${app.gender || '-'}</td>
                <td>${app.nationality}</td>
                <td class="phone-highlight">${app.phone}</td>
                <td><span class="badge-position">${app.position}</span></td>
                <td>${app.experience || '-'}</td>
                <td>${cvCell}</td>
                <td>${app.qatarId || '-'}</td>
                <td>${new Date(app.date).toLocaleString()}</td>
            `;
            tableBody.appendChild(tr);
        });
    }

    window.onload = function() {
        fetchData();
        setInterval(fetchData, 5000);
    };
</script>
</body>
</html>
