<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم الطلبات - شركة تيك تاك</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1100px;
            background: #fff;
            margin: 0 auto;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h2 {
            color: #0056b3;
            text-align: center;
            margin-bottom: 20px;
        }
        .filters {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            background: #eef2f5;
            padding: 15px;
            border-radius: 8px;
            flex-wrap: wrap;
        }
        .filter-group {
            flex: 1;
            min-width: 200px;
        }
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 5px;
            font-size: 14px;
        }
        select, input {
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: center;
            font-size: 14px;
        }
        th {
            background-color: #0056b3;
            color: white;
        }
        tr:nth-child(even) {
            background-color: #f9f9f9;
        }
        .no-data {
            text-align: center;
            padding: 20px;
            color: #777;
        }
        .btn-reset {
            background: #dc3545;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>لوحة تحكم طلبات المشاركة - شركة تيك تاك</h2>
    
    <div class="filters">
        <div class="filter-group">
            <label>الفرز حسب الجنسية:</label>
            <select id="filterNationality" onchange="filterData()">
                <option value="">الكل</option>
            </select>
        </div>
        <div class="filter-group">
            <label>الفرز حسب الوظيفة:</label>
            <select id="filterJob" onchange="filterData()">
                <option value="">الكل</option>
            </select>
        </div>
        <div class="filter-group">
            <label>الفرز حسب السن:</label>
            <select id="filterAge" onchange="filterData()">
                <option value="">الكل</option>
                <option value="under30">أقل من 30 سنة</option>
                <option value="30to40">من 30 إلى 40 سنة</option>
                <option value="above40">أكبر من 40 سنة</option>
            </select>
        </div>
    </div>

    <table>
        <thead>
            <tr>
                <th>الاسم</th>
                <th>تاريخ الميلاد (السن)</th>
                <th>الجنسية</th>
                <th>رقم التواصل</th>
                <th>الوظيفة</th>
                <th>نبذة عن الخبرات</th>
                <th>السيرة الذاتية</th>
                <th>تاريخ التقديم</th>
            </tr>
        </thead>
        <tbody id="tableBody">
            </tbody>
    </table>

    <button class="btn-reset" onclick="clearData()">مسح جميع البيانات المحفوظة</button>
</div>

<script>
    let allApplications = [];

    function loadData() {
        allApplications = JSON.parse(localStorage.getItem('tikTakApplications')) || [];
        populateFilters();
        displayData(allApplications);
    }

    function displayData(data) {
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = '';

        if (data.length === 0) {
            tbody.innerHTML = `<tr><td colspan="8" class="no-data">لا توجد طلبات مسجلة حتى الآن.</td></tr>`;
            return;
        }

        data.forEach(app => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${app.fullName}</td>
                <td>${app.dob} (${app.age} سنة)</td>
                <td>${app.nationality}</td>
                <td><a href="tel:${app.phone}">${app.phone}</a></td>
                <td>${app.jobTitle}</td>
                <td style="max-width: 200px; text-align: right;" title="${app.experience}">${app.experience}</td>
                <td>${app.cvFileName}</td>
                <td>${app.date}</td>
            `;
            tbody.appendChild(tr);
        });
    }

    function populateFilters() {
        const nationalities = [...new Set(allApplications.map(app => app.nationality))];
        const jobs = [...new Set(allApplications.map(app => app.jobTitle))];

        const natSelect = document.getElementById('filterNationality');
        const jobSelect = document.getElementById('filterJob');

        natSelect.innerHTML = '<option value="">الكل</option>';
        nationalities.forEach(nat => {
            natSelect.innerHTML += `<option value="${nat}">${nat}</option>`;
        });

        jobSelect.innerHTML = '<option value="">الكل</option>';
        jobs.forEach(job => {
            jobSelect.innerHTML += `<option value="${job}">${job}</option>`;
        });
    }

    function filterData() {
        const selectedNat = document.getElementById('filterNationality').value;
        const selectedJob = document.getElementById('filterJob').value;
        const selectedAgeRange = document.getElementById('filterAge').value;

        let filtered = allApplications.filter(app => {
            let matchNat = selectedNat === "" || app.nationality === selectedNat;
            let matchJob = selectedJob === "" || app.jobTitle === selectedJob;
            let matchAge = true;

            if (selectedAgeRange === "under30") {
                matchAge = app.age < 30;
            } else if (selectedAgeRange === "30to40") {
                matchAge = app.age >= 30 && app.age <= 40;
            } else if (selectedAgeRange === "above40") {
                matchAge = app.age > 40;
            }

            return matchNat && matchJob && matchAge;
        });

        displayData(filtered);
    }

    function clearData() {
        if (confirm('هل أنت متأكد من مسح كافة الطلبات؟')) {
            localStorage.removeItem('tikTakApplications');
            loadData();
        }
    }

    window.onload = loadData;
</script>

</body>
</html>
