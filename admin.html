<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم الإدارية - TIC TAC</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap');

        :root {
            --primary: #0f172a;
            --primary-light: #1e293b;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --bg-body: #f1f5f9;
            --card-bg: #ffffff;
            --text-main: #334155;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --radius: 16px;
            --shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.04), 0 8px 10px -6px rgba(15, 23, 42, 0.04);
        }

        body {
            font-family: 'Tajawal', sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            margin: 0;
            padding: 30px 20px;
        }

        .admin-layout {
            max-width: 1550px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 30px;
            align-items: start;
        }

        @media (max-width: 1024px) {
            .admin-layout {
                grid-template-columns: 1fr;
            }
        }

        /* شريط الفرز الجانبي المرتب تحت بعضه */
        .filters-sidebar {
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            padding: 25px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .filters-sidebar h3 {
            font-size: 1.1rem;
            color: var(--primary);
            margin: 0 0 10px 0;
            font-weight: 800;
            border-bottom: 2px solid var(--border);
            padding-bottom: 10px;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .filter-group label {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text-muted);
        }

        .filter-group select {
            width: 100%;
            padding: 12px 14px;
            border: 1.5px solid var(--border);
            border-radius: 12px;
            font-size: 0.9rem;
            background: #f8fafc;
            color: var(--text-main);
            font-family: inherit;
            outline: none;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .filter-group select:focus {
            border-color: var(--accent);
            background: #fff;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        /* المحتوى الرئيسي للجدول */
        .admin-main {
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            padding: 30px;
            overflow: hidden;
        }

        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            padding-bottom: 20px;
            margin-bottom: 25px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .admin-header h1 {
            font-size: 1.4rem;
            margin: 0;
            color: var(--primary);
            font-weight: 900;
        }

        .refresh-btn {
            background: var(--accent);
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
            font-family: inherit;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .refresh-btn:hover {
            background: var(--accent-hover);
        }

        .table-container {
            overflow-x: auto;
            border-radius: 12px;
            border: 1px solid var(--border);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: right;
            white-space: nowrap;
        }

        th, td {
            padding: 15px 18px;
            border-bottom: 1px solid var(--border);
            font-size: 0.9rem;
        }

        th {
            background: #f8fafc;
            color: var(--text-muted);
            font-weight: 700;
            font-size: 0.8rem;
            letter-spacing: 0.5px;
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover td {
            background-color: #f8fafc;
        }

        .badge-position {
            background: #eff6ff;
            color: #1d4ed8;
            padding: 6px 12px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.8rem;
            border: 1px solid #dbeafe;
            display: inline-block;
        }

        .phone-highlight {
            font-weight: 700;
            color: var(--accent);
        }

        .cv-link {
            background: var(--primary);
            color: #fff;
            padding: 7px 12px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 0.8rem;
            font-weight: 700;
            display: inline-block;
            transition: opacity 0.2s;
        }

        .cv-link:hover {
            opacity: 0.85;
        }

        .no-cv {
            color: var(--text-muted);
            font-style: italic;
            font-size: 0.85rem;
        }

        .actions-cell {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .status-select {
            padding: 8px 12px;
            border-radius: 10px;
            border: 1.5px solid var(--border);
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
            outline: none;
            font-family: inherit;
        }

        .status-green { background-color: #ecfdf5; color: #047857; border-color: #a7f3d0; }
        .status-yellow { background-color: #fffbeb; color: #b45309; border-color: #fde68a; }
        .status-red { background-color: #fef2f2; color: #b91c1c; border-color: #fecaca; }

        .btn-delete {
            background: #fef2f2;
            color: #b91c1c;
            border: 1px solid #fecaca;
            padding: 8px 12px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 700;
            transition: background 0.2s;
        }

        .btn-delete:hover {
            background: #fee2e2;
        }

        .no-data {
            text-align: center;
            padding: 50px;
            color: var(--text-muted);
            font-weight: 600;
        }
    </style>
</head>
<body>

<div class="admin-layout">
    <!-- قائمة الفرز الجانبية (مرتبة تحت بعضها بشكل عصرى) -->
    <aside class="filters-sidebar">
        <h3>تصفية الطلبات</h3>
        
        <div class="filter-group">
            <label>الجنس</label>
            <select id="filterGender" onchange="renderTable()">
                <option value="">جميع الأجناس</option>
                <option value="ذكر">ذكر</option>
                <option value="أنثى">أنثى</option>
            </select>
        </div>

        <div class="filter-group">
            <label>الجنسية</label>
            <select id="filterNat" onchange="renderTable()">
                <option value="">جميع الجنسيات</option>
                <option value="مصري">مصري</option>
                <option value="هندي">هندي</option>
                <option value="باكستاني">باكستاني</option>
                <option value="سوداني">سوداني</option>
                <option value="سوري">سوري</option>
                <option value="أردني">أردني</option>
                <option value="جنسية أخرى">جنسية أخرى</option>
            </select>
        </div>

        <div class="filter-group">
            <label>الوظيفة المطلوبة</label>
            <select id="filterPos" onchange="renderTable()">
                <option value="">جميع الوظائف</option>
                <option value="فني كهرباء">فني كهرباء</option>
                <option value="فني تكييف (HVAC)">فني تكييف (HVAC)</option>
                <option value="فني سباكة وصحي">فني سباكة وصحي</option>
                <option value="مشرف صيانة عامة">مشرف صيانة عامة</option>
                <option value="مهندس موقع">مهندس موقع</option>
            </select>
        </div>

        <div class="filter-group">
            <label>الفئة العمرية</label>
            <select id="filterAge" onchange="renderTable()">
                <option value="">جميع الأعمار</option>
                <option value="20-30">20 - 30 سنة</option>
                <option value="31-40">31 - 40 سنة</option>
                <option value="41+">41 سنة فأكثر</option>
            </select>
        </div>
    </aside>

    <!-- المحتوى والجدول الرئيسي -->
    <main class="admin-main">
        <div class="admin-header">
            <h1>لوحة التحكم الإدارية - TIC TAC</h1>
            <button class="refresh-btn" onclick="fetchCloudData()">
                <span>🔄 تحديث البيانات</span>
            </button>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>الاسم</th>
                        <th>العمر</th>
                        <th>الجنس</th>
                        <th>الجنسية</th>
                        <th>رقم التواصل</th>
                        <th>الوظيفة</th>
                        <th>نبذة الخبرة</th>
                        <th>السيرة الذاتية</th>
                        <th>إقامة / رخصة / سيارة</th>
                        <th>إجراءات المتابعة</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <tr><td colspan="10" class="no-data">جاري جلب الطلبات من السحابة...</td></tr>
                </tbody>
            </table>
        </div>
    </main>
</div>

<script>
    const BIN_ID = '6738917facd3cb3488f54311';
    let globalApplicants = [];

    function getAgeGroup(age) {
        const num = parseInt(age);
        if (num >= 20 && num <= 30) return '20-30';
        if (num >= 31 && num <= 40) return '31-40';
        if (num >= 41) return '41+';
        return '';
    }

    // جلب الطلبات لحظياً من السحابة (سواء من هاتفك أو المنصات الخارجية)
    async function fetchCloudData() {
        try {
            let response = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest?t=${new Date().getTime()}`, {
                headers: { 'X-Master-Key': '$2a$10$vNqjH1/K9sXz7m3gXvW8UeR8xQ8ZqQyqYq8xQ8ZqQyqYq8xQ8ZqQy' }
            });
            let data = await response.json();
            if (data && data.record) {
                globalApplicants = Array.isArray(data.record) ? data.record : [];
            }
        } catch (e) {
            globalApplicants = JSON.parse(localStorage.getItem('ticTacApplicants')) || [];
        }
        renderTable();
    }

    async function saveCloudData(applicants) {
        globalApplicants = applicants;
        localStorage.setItem('ticTacApplicants', JSON.stringify(applicants));
        try {
            await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                    'X-Master-Key': '$2a$10$vNqjH1/K9sXz7m3gXvW8UeR8xQ8ZqQyqYq8xQ8ZqQyqYq8xQ8ZqQy'
                },
                body: JSON.stringify(applicants)
            });
        } catch (e) {
            console.log("خطأ في التحديث السحابي");
        }
    }

    function updateStatus(index, value) {
        globalApplicants[index].status = value;
        saveCloudData(globalApplicants);
        renderTable();
    }

    function deleteApplicant(index) {
        if(confirm('هل أنت متأكد من حذف هذا الطلب؟')) {
            globalApplicants.splice(index, 1);
            saveCloudData(globalApplicants);
            renderTable();
        }
    }

    function renderTable() {
        const tableBody = document.getElementById('tableBody');
        const genderFilter = document.getElementById('filterGender').value;
        const natFilter = document.getElementById('filterNat').value;
        const posFilter = document.getElementById('filterPos').value;
        const ageFilter = document.getElementById('filterAge').value;

        tableBody.innerHTML = '';

        const filtered = globalApplicants.map((app, originalIndex) => ({ app, originalIndex })).filter(({ app }) => {
            const ageGrp = getAgeGroup(app.age);
            const matchG = !genderFilter || app.gender === genderFilter;
            const matchN = !natFilter || app.nationality === natFilter;
            const matchP = !posFilter || app.position === posFilter;
            const matchA = !ageFilter || ageGrp === ageFilter;
            return matchG && matchN && matchP && matchA;
        });

        if (filtered.length === 0) {
            tableBody.innerHTML = `<tr><td colspan="10" class="no-data">لا توجد طلبات مسجلة حتى الآن.</td></tr>`;
            return;
        }

        filtered.forEach(({ app, originalIndex }) => {
            let cvCell = `<span class="no-cv">لا يوجد</span>`;
            if (app.cvData) {
                cvCell = `<a href="${app.cvData}" download="${app.cvName || 'CV'}" class="cv-link">تحميل CV</a>`;
            }

            let statusClass = '';
            if (app.status === 'green') statusClass = 'status-green';
            else if (app.status === 'yellow') statusClass = 'status-yellow';
            else if (app.status === 'red') statusClass = 'status-red';

            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td><strong>${app.name}</strong></td>
                <td>${app.age}</td>
                <td>${app.gender || '-'}</td>
                <td>${app.nationality}</td>
                <td class="phone-highlight">${app.phone}</td>
                <td><span class="badge-position">${app.position}</span></td>
                <td>${app.experience || '-'}</td>
                <td>${cvCell}</td>
                <td>${app.qatarId || '-'}</td>
                <td>
                    <div class="actions-cell">
                        <select class="status-select ${statusClass}" onchange="updateStatus(${originalIndex}, this.value)">
                            <option value="" ${!app.status ? 'selected' : ''}>اختر الحالة...</option>
                            <option value="green" ${app.status === 'green' ? 'selected' : ''}>🟢 مقبول</option>
                            <option value="yellow" ${app.status === 'yellow' ? 'selected' : ''}>🟡 قيد المراجعة</option>
                            <option value="red" ${app.status === 'red' ? 'selected' : ''}>🔴 مرفوض</option>
                        </select>
                        <button class="btn-delete" onclick="deleteApplicant(${originalIndex})">حذف</button>
                    </div>
                </td>
            `;
            tableBody.appendChild(tr);
        });
    }

    // التحديث التلقائي وجلب البيانات عند الفتح
    window.onload = function() {
        fetchCloudData();
        setInterval(fetchCloudData, 5000);
    };
</script>
</body>
</html>
