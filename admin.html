<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم الأدمن - Tic Tac</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;900&display=swap');
        :root {
            --bg-deep: #f8fafc;
            --surface: #ffffff;
            --accent: #1e3a8a;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --radius: 12px;
        }
        body {
            font-family: 'Tajawal', sans-serif;
            background-color: var(--bg-deep);
            color: var(--text-main);
            margin: 0;
            padding: 30px;
        }
        .admin-container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--surface);
            padding: 20px 30px;
            border-radius: var(--radius);
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
            border: 1px solid var(--border);
            margin-bottom: 25px;
        }
        .header h1 {
            color: var(--accent);
            margin: 0;
            font-size: 1.5rem;
        }
        .search-box {
            display: flex;
            gap: 15px;
            background: var(--surface);
            padding: 20px;
            border-radius: var(--radius);
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
            border: 1px solid var(--border);
            margin-bottom: 25px;
        }
        .search-box input, .search-box select {
            flex: 1;
            padding: 12px 15px;
            border: 1.5px solid var(--border);
            border-radius: 8px;
            font-family: inherit;
            outline: none;
        }
        .table-responsive {
            background: var(--surface);
            border-radius: var(--radius);
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
            border: 1px solid var(--border);
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: right;
        }
        th, td {
            padding: 15px 20px;
            border-bottom: 1px solid var(--border);
            font-size: 0.9rem;
        }
        th {
            background: #f1f5f9;
            color: var(--accent);
            font-weight: 700;
        }
        tr:hover {
            background: #f8fafc;
        }
        .btn-cv {
            background: var(--accent);
            color: white;
            padding: 6px 12px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 0.8rem;
            font-weight: 700;
        }
        .no-data {
            text-align: center;
            padding: 40px;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

<div class="admin-container">
    <div class="header">
        <h1>لوحة تحكم طلبات التوظيف - Tic Tac</h1>
        <button onclick="loadApplicants()" style="background:var(--accent); color:#fff; border:none; padding:10px 20px; border-radius:8px; cursor:pointer; font-family:inherit; font-weight:700;">تحديث البيانات 🔄</button>
    </div>

    <div class="search-box">
        <input type="text" id="searchInput" placeholder="ابحث بالاسم، رقم الهاتف، أو الجنسية..." onkeyup="filterTable()">
        <select id="positionFilter" onchange="filterTable()">
            <option value="">جميع التخصصات والوظائف</option>
        </select>
    </div>

    <div class="table-responsive">
        <table>
            <thead>
                <tr>
                    <th>التاريخ والوقت</th>
                    <th>الاسم الكامل</th>
                    <th>العمر والجنس</th>
                    <th>الجنسية</th>
                    <th>وسائل التواصل</th>
                    <th>الوظيفة المستهدفة</th>
                    <th>تفاصيل قطر (إقامة/رخصة/سيارة)</th>
                    <th>الخبرة</th>
                    <th>السيرة الذاتية (CV)</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <tr><td colspan="9" class="no-data">جاري تحميل البيانات...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    // ضع رابط جوجل شيت أو مسار جلب البيانات هنا لاحقاً
    let allApplicants = [];

    async function loadApplicants() {
        // سيتم ربطها تلقائياً بالبيانات الواردة من جدول جوجل
        document.getElementById('tableBody').innerHTML = `<tr><td colspan="9" class="no-data">لا توجد طلبات مسجلة حتى الآن.</td></tr>`;
    }

    function filterTable() {
        // أدوات البحث المتاحة لكل التفاصيل
    }

    window.onload = loadApplicants;
</script>
</body>
</html>
