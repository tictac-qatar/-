<!DOCTYPE html>
<html lang="en" dir="ltr" id="htmlTag">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TIC TAC Trading & Contracting - Partnership Application</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Cairo:wght@400;600;700&family=Noto+Nastaliq+Urdu:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #1e3a8a;
            --primary-hover: #1e40af;
            --accent: #2563eb;
            --bg-gradient: linear-gradient(135deg, #f0f4f8 0%, #d9e2ec 100%);
            --card-bg: #ffffff;
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --border: #e5e7eb;
            --radius: 14px;
        }
        body {
            font-family: 'Plus Jakarta Sans', 'Cairo', sans-serif;
            background: var(--bg-gradient);
            color: var(--text-main);
            margin: 0;
            padding: 40px 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .wrapper { width: 100%; max-width: 680px; }
        .card {
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            padding: 40px;
            box-sizing: border-box;
            border: 1px solid rgba(255, 255, 255, 0.8);
        }
        .top-bar { display: flex; justify-content: flex-end; margin-bottom: 25px; }
        .lang-select-wrapper { position: relative; display: inline-block; }
        .lang-select-wrapper select {
            appearance: none;
            background-color: #f8fafc;
            border: 1px solid var(--border);
            padding: 8px 36px 8px 14px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-main);
            cursor: pointer;
        }
        .header-section {
            text-align: center;
            margin-bottom: 35px;
            border-bottom: 2px solid #f3f4f6;
            padding-bottom: 25px;
        }
        h2 { font-size: 26px; font-weight: 700; color: var(--primary); margin: 0 0 8px 0; }
        .subtitle { font-size: 14px; color: var(--text-muted); font-weight: 500; text-transform: uppercase; letter-spacing: 1px; }
        .form-group { margin-bottom: 22px; }
        label { display: block; font-weight: 600; font-size: 14px; margin-bottom: 8px; color: #374151; }
        input[type="text"], input[type="date"], input[type="tel"], textarea {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--border);
            border-radius: 10px;
            box-sizing: border-box;
            font-size: 15px;
            background-color: #fafafa;
            color: var(--text-main);
            font-family: inherit;
        }
        input:focus, textarea:focus { outline: none; border-color: var(--accent); background-color: #fff; }
        textarea { resize: vertical; height: 110px; }
        .file-upload-box {
            border: 2px dashed var(--border);
            border-radius: 10px;
            padding: 18px;
            text-align: center;
            background: #fafafa;
            cursor: pointer;
            position: relative;
        }
        input[type="file"] { opacity: 0; position: absolute; top: 0; left: 0; width: 100%; height: 100%; cursor: pointer; }
        .file-upload-text { font-size: 14px; color: var(--text-muted); font-weight: 500; }
        button[type="submit"] {
            background: var(--accent);
            color: white;
            padding: 14px 20px;
            border: none;
            border-radius: 10px;
            width: 100%;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
            margin-top: 10px;
        }
        button[type="submit"]:hover { background: var(--primary-hover); }
        .contact-info { text-align: center; margin-top: 30px; padding-top: 20px; border-top: 1px solid var(--border); font-size: 14px; color: var(--text-muted); }
        .contact-info a { color: #10b981; text-decoration: none; font-weight: 700; }
    </style>
</head>
<body>
<div class="wrapper">
    <div class="card">
        <div class="top-bar">
            <div class="lang-select-wrapper">
                <select id="languageSelect" onchange="changeLanguage()">
                    <option value="en" selected>English</option>
                    <option value="ar">العربية</option>
                    <option value="ur">اردو</option>
                </select>
            </div>
        </div>
        <div class="header-section">
            <h2 id="compTitle">TIC TAC Trading & Contracting</h2>
            <div class="subtitle" id="compSub">Partnership & Job Application Form</div>
        </div>
        <form id="applicationForm" onsubmit="submitForm(event)">
            <div class="form-group">
                <label id="labelName">Full Name</label>
                <input type="text" id="fullName" required placeholder="Enter your full name">
            </div>
            <div class="form-group">
                <label id="labelDob">Date of Birth</label>
                <input type="date" id="dob" required>
            </div>
            <div class="form-group">
                <label id="labelNationality">Nationality</label>
                <input type="text" id="nationality" required placeholder="e.g., Qatari, Egyptian, Indian ...">
            </div>
            <div class="form-group">
                <label id="labelPhone">Contact Number</label>
                <input type="tel" id="phone" required placeholder="00974XXXXXXXX">
            </div>
            <div class="form-group">
                <label id="labelJob">Job Title / Position</label>
                <input type="text" id="jobTitle" required placeholder="e.g., Engineer, Technician, Admin ...">
            </div>
            <div class="form-group">
                <label id="labelExp">Brief about your practical work experience</label>
                <textarea id="experience" required placeholder="Write briefly about your previous work experience..."></textarea>
            </div>
            <div class="form-group">
                <label id="labelCv">Upload CV (PDF, DOC)</label>
                <div class="file-upload-box">
                    <span class="file-upload-text" id="fileText">Click or drag file to upload CV</span>
                    <input type="file" id="cvFile" accept=".pdf,.doc,.docx" required onchange="updateFileName(this)">
                </div>
            </div>
            <button type="submit" id="submitBtn">Submit Application</button>
        </form>
        <div class="contact-info" id="contactText">
            For inquiries (Call / WhatsApp): <a href="https://wa.me/97466608077" target="_blank">66608077</a>
        </div>
    </div>
</div>
<script>
    const translations = {
        en: {
            dir: "ltr", font: "'Plus Jakarta Sans', sans-serif",
            compTitle: "TIC TAC Trading & Contracting",
            compSub: "Partnership & Job Application Form",
            labelName: "Full Name", phName: "Enter your full name",
            labelDob: "Date of Birth", labelNationality: "Nationality", phNationality: "e.g., Qatari, Egyptian, Indian ...",
            labelPhone: "Contact Number", labelJob: "Job Title / Position", phJob: "e.g., Engineer, Technician, Admin ...",
            labelExp: "Brief about your practical work experience", phExp: "Write briefly about your previous work experience...",
            labelCv: "Upload CV (PDF, DOC)", fileText: "Click or drag file to upload CV",
            submitBtn: "Submit Application",
            contactText: 'For inquiries (Call / WhatsApp): <a href="https://wa.me/97466608077" target="_blank">66608077</a>',
            successMsg: "Application submitted successfully! Thank you."
        },
        ar: {
            dir: "rtl", font: "'Cairo', sans-serif",
            compTitle: "شركة TIC TAC للتجارة والمقاولات",
            compSub: "نموذج طلب مشاركة وعمل",
            labelName: "الاسم الكامل", phName: "أدخل اسمك الكامل",
            labelDob: "تاريخ الميلاد", labelNationality: "الجنسية", phNationality: "مثال: قطري، مصري، هندي ...",
            labelPhone: "رقم التواصل", labelJob: "الوظيفة المطلوبة / الحالية", phJob: "مثال: مهندس، فني، إداري ...",
            labelExp: "نبذة عن خبراتك في العمل الفعلي", phExp: "اكتب باختصار عن خبراتك السابقة في مجال العمل...",
            labelCv: "تحميل السيرة الذاتية (CV)", fileText: "انقر لاختيار ملف السيرة الذاتية",
            submitBtn: "تقديم الطلب",
            contactText: 'للاستفسار والتواصل (اتصال / واتساب): <a href="https://wa.me/97466608077" target="_blank">66608077</a>',
            successMsg: "تم تقديم الطلب بنجاح! شكراً لك."
        },
        ur: {
            dir: "rtl", font: "'Noto Nastaliq Urdu', serif",
            compTitle: "TIC TAC ٹریڈنگ اینڈ کنٹریکٹنگ",
            compSub: "پارٹنرشپ اور جاب ایپلیکیشن فارم",
            labelName: "پورا نام", phName: "اپنا پورا نام درج کریں",
            labelDob: "تاریخ پیدائش", labelNationality: "قومیت", phNationality: "مثلا: قطری، مصری، ہندوستانی ...",
            labelPhone: "رابطہ نمبر", labelJob: "عہدہ / ملازمت کی پوزیشن", phJob: "مثلا: انجینئر، ٹیکنیشن، ایڈمن ...",
            labelExp: "عملی تجربے کا خلاصہ", phExp: "اپنے پچھلے کام کے تجربے کے بارے میں مختصر لکھیں...",
            labelCv: "سی وی اپ لوڈ کریں (PDF, DOC)", fileText: "فائل منتخب کرنے کے لیے یہاں کلک کریں",
            submitBtn: "درخواست جمع کرائیں",
            contactText: 'انکوائری اور رابطہ (کال / واٹس ایپ): <a href="https://wa.me/97466608077" target="_blank">66608077</a>',
            successMsg: "درخواست کامیابی کے ساتھ جمع ہو گئی ہے! شکریہ."
        }
    };
    function changeLanguage() {
        const lang = document.getElementById('languageSelect').value;
        const t = translations[lang];
        document.getElementById('htmlTag').setAttribute('lang', lang);
        document.getElementById('htmlTag').setAttribute('dir', t.dir);
        document.body.style.fontFamily = t.font;
        document.getElementById('compTitle').innerText = t.compTitle;
        document.getElementById('compSub').innerText = t.compSub;
        document.getElementById('labelName').innerText = t.labelName;
        document.getElementById('fullName').placeholder = t.phName;
        document.getElementById('labelDob').innerText = t.labelDob;
        document.getElementById('labelNationality').innerText = t.labelNationality;
        document.getElementById('nationality').placeholder = t.phNationality;
        document.getElementById('labelPhone').innerText = t.labelPhone;
        document.getElementById('labelJob').innerText = t.labelJob;
        document.getElementById('jobTitle').placeholder = t.phJob;
        document.getElementById('labelExp').innerText = t.labelExp;
        document.getElementById('experience').placeholder = t.phExp;
        document.getElementById('labelCv').innerText = t.labelCv;
        document.getElementById('fileText').innerText = t.fileText;
        document.getElementById('submitBtn').innerText = t.submitBtn;
        document.getElementById('contactText').innerHTML = t.contactText;
    }
    function updateFileName(input) {
        if (input.files && input.files[0]) {
            document.getElementById('fileText').innerText = "✓ " + input.files[0].name;
        }
    }
    function submitForm(event) {
        event.preventDefault();
        const lang = document.getElementById('languageSelect').value;
        const fullName = document.getElementById('fullName').value;
        const dob = document.getElementById('dob').value;
        const nationality = document.getElementById('nationality').value.trim();
        const phone = document.getElementById('phone').value;
        const jobTitle = document.getElementById('jobTitle').value.trim();
        const experience = document.getElementById('experience').value;
        const cvFileName = document.getElementById('cvFile').files[0] ? document.getElementById('cvFile').files[0].name : "No file";
        const birthDate = new Date(dob);
        const today = new Date();
        let age = today.getFullYear() - birthDate.getFullYear();
        const m = today.getMonth() - birthDate.getMonth();
        if (m < 0 || (m === 0 && today.getDate() - birthDate.getDate() < 0)) age--;
        const newApplication = { id: Date.now(), fullName, dob, age, nationality, phone, jobTitle, experience, cvFileName, date: new Date().toLocaleDateString('en-GB') };
        let applications = JSON.parse(localStorage.getItem('TICTACApplications')) || [];
        applications.push(newApplication);
        localStorage.setItem('TICTACApplications', JSON.stringify(applications));
        alert(translations[lang].successMsg);
        document.getElementById('applicationForm').reset();
        document.getElementById('fileText').innerText = translations[lang].fileText;
    }
</script>
</body>
</html>
