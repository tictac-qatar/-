<!DOCTYPE html>
<html lang="ar" dir="rtl" id="htmlTag">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac for building maintenance</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;900&display=swap');
        
        :root {
            --bg-page: #fdfbf7;         /* خلفية بيج هادئة مستوحاة من اللوجو */
            --surface-card: #ffffff;    /* أبيض نقي للحقول والكرت */
            --primary-dark: #132235;    /* كحلي داكن جداً للخطوط والعناوين */
            --accent-copper: #b86a30;   /* برتقالي نحاسي دافئ (لون السهم في اللوجو) */
            --accent-glow: rgba(184, 106, 48, 0.12);
            --border: #e7e2d8;          /* حدود ناعمة متناسقة مع الخلفية البيج */
            --border-focus: #b86a30;
            --radius: 16px;
        }

        body {
            font-family: 'Tajawal', 'Traditional Arabic', sans-serif;
            background-color: var(--bg-page);
            color: var(--primary-dark);
            margin: 0;
            padding: 40px 20px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
        }

        .form-container {
            width: 100%;
            max-width: 820px;
            background: var(--surface-card);
            border-radius: var(--radius);
            box-shadow: 0 15px 35px -5px rgba(19, 34, 53, 0.08);
            border: 1.5px solid var(--border);
            padding: 45px;
            box-sizing: border-box;
            position: relative;
            overflow: hidden;
        }

        .form-container::before {
            content: '';
            position: absolute;
            top: 0; right: 0; left: 0;
            height: 5px;
            background: linear-gradient(90deg, var(--primary-dark), var(--accent-copper));
        }

        .lang-switcher {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            margin-bottom: 20px;
        }

        .lang-btn {
            background: var(--bg-page);
            border: 1.5px solid var(--border);
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 700;
            color: #64748b;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: inherit;
        }

        .lang-btn.active, .lang-btn:hover {
            background: var(--primary-dark);
            color: #ffffff;
            border-color: var(--primary-dark);
        }

        .brand-header {
            text-align: center;
            margin-bottom: 35px;
        }

        .brand-logo-text {
            font-size: 1.9rem;
            font-weight: 900;
            color: var(--primary-dark);
            letter-spacing: 1px;
            margin-bottom: 6px;
        }

        .brand-logo-text span {
            color: var(--accent-copper);
        }

        .brand-header p {
            color: var(--accent-copper);
            font-size: 0.95rem;
            margin: 0;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .section-title {
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--primary-dark);
            border-bottom: 2px solid var(--accent-copper);
            padding-bottom: 8px;
            margin: 30px 0 20px 0;
            display: inline-block;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 22px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 9px;
        }

        .form-group.full-width {
            grid-column: span 2;
        }

        label {
            font-size: 0.88rem;
            font-weight: 700;
            color: var(--primary-dark);
        }

        input, select, textarea {
            width: 100%;
            padding: 14px 16px;
            border: 1.5px solid var(--border);
            border-radius: 12px;
            font-size: 0.95rem;
            background: #ffffff;
            color: var(--primary-dark);
            font-family: inherit;
            outline: none;
            box-sizing: border-box;
            transition: all 0.25s ease;
        }

        input:focus, select:focus, textarea:focus {
            border-color: var(--border-focus);
            background: #ffffff;
            box-shadow: 0 0 0 4px var(--accent-glow);
        }

        .file-upload-wrapper {
            position: relative;
            border: 2px dashed var(--border);
            border-radius: 12px;
            padding: 24px;
            text-align: center;
            background: var(--bg-page);
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .file-upload-wrapper input[type="file"] {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            opacity: 0;
            cursor: pointer;
        }

        .file-upload-text {
            color: #64748b;
            font-size: 0.9rem;
            font-weight: 500;
        }

        .submit-btn {
            background: linear-gradient(135deg, var(--primary-dark), #1d3557);
            color: #fff;
            border: none;
            width: 100%;
            padding: 16px;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            font-family: inherit;
            margin-top: 35px;
            transition: all 0.3s ease;
            box-shadow: 0 10px 20px -5px rgba(19, 34, 53, 0.2);
        }

        .submit-btn:hover {
            background: linear-gradient(135deg, var(--accent-copper), #9c5825);
            transform: translateY(-2px);
        }

        .support-footer {
            margin-top: 40px;
            border-top: 1.5px solid var(--border);
            padding-top: 25px;
            text-align: center;
        }

        .support-footer h3 {
            font-size: 1.1rem;
            color: var(--primary-dark);
            margin-bottom: 12px;
            font-weight: 700;
        }

        .support-contacts {
            display: flex;
            justify-content: center;
            gap: 30px;
            flex-wrap: wrap;
        }

        .support-item {
            font-size: 0.95rem;
            color: #64748b;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .support-item a {
            color: var(--accent-copper);
            text-decoration: none;
            font-weight: 700;
        }

        @media (max-width: 768px) {
            .form-grid { grid-template-columns: 1fr; }
            .form-group.full-width { grid-column: span 1; }
            .form-container { padding: 25px; }
            .support-contacts { flex-direction: column; gap: 10px; }
        }
    </style>
</head>
<body>

<div class="form-container">
    <div class="lang-switcher">
        <button type="button" class="lang-btn active" onclick="setLanguage('ar', event)">عربي</button>
        <button type="button" class="lang-btn" onclick="setLanguage('en', event)">English</button>
        <button type="button" class="lang-btn" onclick="setLanguage('ur', event)">اردو</button>
    </div>

    <div class="brand-header">
        <h1 class="brand-logo-text">Tic Tac <span>صيانة المباني</span></h1>
        <p id="subHeader">طلب انضمام لفريق العمل - دولة قطر</p>
    </div>

    <form id="jobForm" action="https://formsubmit.co/Tictac.qatar@gmail.com" method="POST" enctype="multipart/form-data" onsubmit="sendToWhatsApp(event)">
        
        <input type="hidden" name="_subject" value="📋 طلب انضمام جديد - شركة Tic Tac">
        <input type="hidden" name="_template" value="table">
        <input type="hidden" name="_captcha" value="false">
        <input type="hidden" name="_autoresponse" value="مرحباً بك، تم استلام طلب انضمامك لشركة Tic Tac بنجاح وسقوم مراجعة سيرتك الذاتية والتواصل معك قريباً.">
        <input type="hidden" name="_properties" value="الاسم الكامل (Full Name), العمر (Age), الجنس (Gender), الجنسية (Nationality), رقم الهاتف والواتساب (Phone), البريد الإلكتروني (Email), الوظيفة المستهدفة (Position), حالة الإقامة في قطر (Iqama Status), رخصة القيادة (Driving License), توفر سيارة خاصة (Has Car), نبذة عن الخبرة (Experience)">

        <div class="section-title" data-i18n="secBasic">المعلومات الأساسية</div>
        <div class="form-grid">
            <div class="form-group full-width">
                <label data-i18n="lblName">الاسم الكامل</label>
                <input type="text" id="fullName" name="الاسم الكامل (Full Name)" required data-i18n-placeholder="phName" placeholder="أدخل اسمك الثلاثي كما هو في الأوراق الرسمية">
            </div>

            <div class="form-group">
                <label data-i18n="lblAge">العمر</label>
                <input type="number" id="age" name="العمر (Age)" required data-i18n-placeholder="phAge" placeholder="مثال: 32">
            </div>

            <div class="form-group">
                <label data-i18n="lblGender">الجنس</label>
                <select id="gender" name="الجنس (Gender)" required>
                    <option value="" data-i18n="optGenderDefault">اختر الجنس...</option>
                    <option value="ذكر" data-i18n="optMale">ذكر</option>
                    <option value="أنثى" data-i18n="optFemale">أنثى</option>
                </select>
            </div>

            <div class="form-group">
                <label data-i18n="lblNationality">الجنسية</label>
                <select id="nationality" name="الجنسية (Nationality)" required>
                    <option value="" data-i18n="optNatDefault">اختر الجنسية...</option>
                    <option value="قطري">قطري / Qatari</option>
                    <option value="مصري">مصري / Egyptian</option>
                    <option value="هندي">هندي / Indian</option>
                    <option value="باكستاني">باكستاني / Pakistani</option>
                    <option value="بنغلاديشي">بنغلاديشي / Bangladeshi</option>
                    <option value="نيبالي">نيبالي / Nepalese</option>
                    <option value="سوداني">سوداني / Sudanese</option>
                    <option value="سوري">سوري / Syrian</option>
                    <option value="أردني">أردني / Jordanian</option>
                    <option value="فلسطيني">فلسطيني / Palestinian</option>
                    <option value="لبناني">لبناني / Lebanese</option>
                    <option value="يمني">يمني / Yemeni</option>
                    <option value="فلبيني">فلبيني / Filipino</option>
                    <option value="سريلانكي">سريلانكي / Sri Lankan</option>
                    <option value="تونسى">تونسى / Tunisian</option>
                    <option value="مغربي">مغربي / Moroccan</option>
                    <option value="جزائري">جزائري / Algerian</option>
                    <option value="أخرى">أخرى / Other</option>
                </select>
            </div>
        </div>

        <div class="section-title" data-i18n="secContact">بيانات التواصل</div>
        <div class="form-grid">
            <div class="form-group">
                <label data-i18n="lblPhone">رقم الهاتف / واتساب (مع رمز الدولة)</label>
                <input type="text" id="phone" name="رقم الهاتف والواتساب (Phone)" required placeholder="+974 xxxxxxxx">
            </div>

            <div class="form-group">
                <label data-i18n="lblEmail">البريد الإلكتروني</label>
                <input type="email" id="email" name="البريد الإلكتروني (Email)" required placeholder="name@example.com">
            </div>
        </div>

        <div class="section-title" data-i18n="secJob">المسمى الوظيفي والتخصصات</div>
        <div class="form-grid">
            <div class="form-group full-width">

                <select id="position" name="الوظيفة المستهدفة (Position)" required>
                    <option value="" data-i18n="optPosDefault">اختر التخصص الوظيفي...</option>
                    <option value="مدير مشروع (مقاولات)">مدير مشروع (مقاولات) / Project Manager</option>
                    <option value="مدير إنشاءات وصيانة عامة">مدير إنشاءات وصيانة عامة / Construction & Maintenance Manager</option>
                    <option value="مهندس تخطيط ومتابعة (Planning Engineer)">مهندس تخطيط ومتابعة / Planning Engineer</option>
                    <option value="مهندس عقود وكميات (QS)">مهندس عقود وكميات / Quantity Surveyor</option>
                    <option value="مهندس موقع تنفيذي (Civil/MEP)">مهندس موقع تنفيذي / Site Engineer (Civil/MEP)</option>
                    <option value="مهندس ألامن والسلامة (HSE Engineer)">مهندس الأمن والسلامة / HSE Engineer</option>
                    <option value="مسؤول المشتريات واللوجستيات">مسؤول المشتريات واللوجستيات / Procurement & Logistics Officer</option>
                    <option value="محاسب مالي وإداري">محاسب مالي وإداري / Financial & Administrative Accountant</option>
                    <option value="مسؤول موارد بشرية وعلاقات حكومية (مندوب)">مسؤول موارد بشرية وعلاقات حكومية / HR & Government Relations</option>
                    <option value="مشرف صيانة عامة (Superintendent)">مشرف صيانة عامة / General Maintenance Superintendent</option>
                    <option value="مراقب عمال (فورمان عام)">مراقب عمال (فورمان عام) / General Foreman</option>
                    <option value="فني كهرباء مباني وكابلات">فني كهرباء مباني وكابلات / Building Electrician</option>
                    <option value="فني تكييف وتبريد (HVAC)">فني تكييف وتبريد / HVAC Technician</option>
                    <option value="فني سباكة وصحي">فني سباكة وصحي / Plumbing Technician</option>
                    <option value="فني لحام وتشكيل معادن">فني لحام وتشكيل معادن / Welder & Metal Fabricator</option>
                    <option value="فني نجارة وأبواب">فني نجارة وأبواب / Carpenter</option>
                    <option value="فني دهانات وديكور">فني دهانات وديكور / Painter & Decorator</option>
                    <option value="فني جبس بورد وتزيين">فني جبس بورد وتزيين / Gypsum Technician</option>
                    <option value="فني ألمنيوم وواجهات زجاجية">فني ألمنيوم وواجهات زجاجية / Aluminum & Glass Technician</option>
                    <option value="فني بلاط ورخام (سيراميك)">فني بلاط ورخام / Tile & Marble Fixer</option>
                    <option value="فني مباني ولياسة (طوب وبلاستر)">فني مباني ولياسة / Mason & Plasterer</option>
                    <option value="سائق معدات ثقيلة / رخصة قطرية">سائق معدات ثقيلة / Heavy Equipment Driver</option>
                    <option value="سائق سيارة خفيفة / رخصة قطرية">سائق سيارة خفيفة / Light Vehicle Driver</option>
                    <option value="مساعد فني / عامل عادي">مساعد فني / عامل عادي / Assistant / General Labour</option>
                    <option value="أخرى">أخرى / Other</option>
                </select>
            </div>

            <div class="form-group">
                <label data-i18n="lblIqama">حالة الإقامة في قطر</label>
                <select id="iqama" name="حالة الإقامة في قطر (Iqama Status)" required>
                    <option value="" data-i18n="optIqamaDefault">اختر حالة الإقامة...</option>

                    <option value="زيارة / تأشيرة مؤقتة" data-i18n="iqama2">زيارة / تأشيرة مؤقتة</option>
                    <option value="خارج الدولة (تأشيرة جديدة)" data-i18n="iqama3">خارج الدولة (تأشيرة جديدة)</option>
                </select>
            </div>

            <div class="form-group">
                <label data-i18n="lblLicense">رخصة القيادة</label>
                <select id="license" name="رخصة القيادة (Driving License)" required>
                    <option value="" data-i18n="optLicDefault">اختر نوع الرخصة...</option>
                    <option value="رخصة قيادة قطرية خفيفة سارية" data-i18n="lic1">رخصة قيادة قطرية خفيفة سارية</option>
                    <option value="رخصة قيادة قطرية ثقيلة / معدات" data-i18n="lic2">رخصة قيادة قطرية ثقيلة / معدات</option>
                    <option value="رخصة دولية / خليجية" data-i18n="lic3">رخصة دولية / خليجية</option>
                    <option value="بدون رخصة قيادة" data-i18n="lic4">بدون رخصة قيادة</option>
                </select>
            </div>

            <div class="form-group">
                <label data-i18n="lblCar">توفر السيارة</label>
                <select id="car" name="توفر سيارة خاصة (Has Car)" required>
                    <option value="" data-i18n="optCarDefault">هل تمتلك سيارة خاصة؟</option>
                    <option value="نعم، أمتلك سيارة خاصة" data-i18n="carYes">نعم، أمتلك سيارة خاصة</option>
                    <option value="لا، لا أمتلك سيارة" data-i18n="carNo">لا، لا أمتلك سيارة</option>
                </select>
            </div>

            <div class="form-group">
                <label data-i18n="lblCv">السيرة الذاتية (CV)</label>
                <div class="file-upload-wrapper">
                    <span class="file-upload-text" id="fileNameDisplay" data-i18n="cvText">اختر ملف السيرة الذاتية (PDF, DOC)</span>
                    <input type="file" name="attachment" accept=".pdf,.doc,.docx" onchange="updateFileName(this)">
                </div>
            </div>

            <div class="form-group full-width">
                <label data-i18n="lblExp">نبذة عن الخبرة السابقة</label>
                <textarea id="experience" name="نبذة عن الخبرة (Experience)" rows="3" data-i18n-placeholder="phExp" placeholder="اكتب ملخص سريع لخبراتك السابقة في قطاع المقاولات والصيانة..."></textarea>
            </div>
        </div>

        <button type="submit" class="submit-btn" id="submitBtn" data-i18n="btnSubmit">إرسال الطلب الآن</button>
    </form>

    <div class="support-footer">
        <h3 data-i18n="supportTitle">للتواصل والدعم الفني</h3>
        <div class="support-contacts">
            <div class="support-item">
                <span data-i18n="supportPhone">📞 الهاتف / واتساب:</span>
                <a href="tel:66608077">66608077</a>
            </div>
            <div class="support-item">
                <span data-i18n="supportEmail">✉️ البريد الإلكتروني:</span>
                <a href="mailto:Tictac.qatar@gmail.com">Tictac.qatar@gmail.com</a>
            </div>
        </div>
    </div>
</div>

    let currentLang = 'ar';

    function setLanguage(lang, event) {
        currentLang = lang;
        const t = translations[lang];
        
        document.getElementById('htmlTag').setAttribute('lang', lang);
        document.getElementById('htmlTag').setAttribute('dir', t.dir);

        document.querySelectorAll('.lang-btn').forEach(btn => {
            btn.classList.remove('active');
        });
        if (event && event.target) {
            event.target.classList.add('active');
        }

        document.getElementById('subHeader').textContent = t.subHeader;

        document.querySelectorAll('[data-i18n]').forEach(el => {
            const key = el.getAttribute('data-i18n');
            if (t[key]) el.textContent = t[key];
        });

        document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
            const key = el.getAttribute('data-i18n-placeholder');
            if (t[key]) el.placeholder = t[key];
        });
    }

    function updateFileName(input) {
        const display = document.getElementById('fileNameDisplay');
        if (input.files.length > 0) {
            display.textContent = "✓ " + input.files[0].name;
            display.style.color = "var(--accent-copper)";
            display.style.fontWeight = "700";
        }
    }

    function sendToWhatsApp(event) {
        const name = document.getElementById('fullName').value;
        const age = document.getElementById('age').value;
        const gender = document.getElementById('gender').value;
        const nationality = document.getElementById('nationality').value;
        const phone = document.getElementById('phone').value;
        const email = document.getElementById('email').value;
        const position = document.getElementById('position').value;
        const iqama = document.getElementById('iqama').value;
        const license = document.getElementById('license').value;
        const car = document.getElementById('car').value;
        const exp = document.getElementById('experience').value || 'لا يوجد';

        const whatsappMessage = 
            `📋 *طلب انضمام جديد - شركة Tic Tac*\n\n` +
            `👤 *الاسم:* ${name}\n` +
            `🎂 *العمر:* ${age} | 🚻 *الجنس:* ${gender}\n` +
            `🌍 *الجنسية:* ${nationality}\n` +
            `📱 *الهاتف/واتساب:* ${phone}\n` +
            `✉️ *البريد:* ${email}\n` +
            `🎯 *الوظيفة:* ${position}\n` +
            `🏠 *الإقامة:* ${iqama}\n` +
            `🚗 *الرخصة:* ${license}\n` +
            `🚙 *السيارة:* ${car}\n` +
            `📝 *الخبرة:* ${exp}\n\n` +
            `_تم إرسال نسخة من الطلب إلى الإيميل._`;

        const adminPhone = "97466608077";
        const encodedMessage = encodeURIComponent(whatsappMessage);
        
        window.open(`https://wa.me/${adminPhone}?text=${encodedMessage}`, '_blank');
    }
