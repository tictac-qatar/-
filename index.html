<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الانضمام لفريق العمل - TIC TAC</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;900&display=swap');
        
        :root {
            --bg-deep: #ffffff;
            --surface: #f8fafc;
            --surface-card: #ffffff;
            --accent: #1e3a8a;
            --accent-glow: rgba(30, 58, 138, 0.15);
            --accent-hover: #1e40af;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --border-focus: #1e3a8a;
            --radius: 16px;
        }

        body {
            font-family: 'Tajawal', sans-serif;
            background-color: var(--bg-deep);
            color: var(--text-main);
            margin: 0;
            padding: 40px 20px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
        }

        .form-container {
            width: 100%;
            max-width: 820px;
            background: var(--surface);
            border-radius: var(--radius);
            box-shadow: 0 15px 35px -5px rgba(0, 0, 0, 0.08);
            border: 1.5px solid var(--border);
            padding: 45px;
            box-sizing: border-box;
            position: relative;
            overflow: hidden;
        }

        .form-container::before {
            content: '';
            position: absolute;
            top: 0; right: 0; left: 0;
            height: 4px;
            background: linear-gradient(90deg, #1e3a8a, #3b82f6);
        }

        .brand-header {
            text-align: center;
            margin-bottom: 35px;
        }

        .brand-logo-text {
            font-size: 2.2rem;
            font-weight: 900;
            color: #1e3a8a;
            letter-spacing: 2px;
            margin-bottom: 6px;
        }

        .brand-logo-text span {
            color: #3b82f6;
        }

        .brand-header p {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin: 0;
            font-weight: 500;
        }

        .section-title {
            font-size: 1.05rem;
            font-weight: 700;
            color: #1e3a8a;
            border-bottom: 1.5px solid var(--border);
            padding-bottom: 8px;
            margin: 30px 0 20px 0;
            letter-spacing: 0.5px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 22px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 9px;
        }

        .form-group.full-width {
            grid-column: span 2;
        }

        label {
            font-size: 0.88rem;
            font-weight: 700;
            color: var(--text-main);
        }

        input, select, textarea {
            width: 100%;
            padding: 14px 16px;
            border: 1.5px solid var(--border);
            border-radius: 12px;
            font-size: 0.95rem;
            background: var(--surface-card);
            color: var(--text-main);
            font-family: inherit;
            outline: none;
            box-sizing: border-box;
            transition: all 0.25s ease;
        }

        input::placeholder, textarea::placeholder {
            color: #94a3b8;
        }

        input:focus, select:focus, textarea:focus {
            border-color: var(--border-focus);
            background: #ffffff;
            box-shadow: 0 0 0 4px var(--accent-glow);
        }

        select option {
            background-color: #ffffff;
            color: var(--text-main);
        }

        .file-upload-wrapper {
            position: relative;
            border: 2px dashed var(--border);
            border-radius: 12px;
            padding: 24px;
            text-align: center;
            background: var(--surface-card);
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .file-upload-wrapper:hover {
            border-color: var(--accent);
            background: rgba(30, 58, 138, 0.02);
        }

        .file-upload-wrapper input[type="file"] {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            opacity: 0;
            cursor: pointer;
        }

        .file-upload-text {
            color: var(--text-muted);
            font-size: 0.9rem;
            font-weight: 500;
        }

        .submit-btn {
            background: linear-gradient(135deg, #1e3a8a, #1e40af);
            color: #fff;
            border: none;
            width: 100%;
            padding: 16px;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            font-family: inherit;
            margin-top: 35px;
            transition: all 0.3s ease;
            box-shadow: 0 10px 20px -5px rgba(30, 58, 138, 0.25);
        }

        .submit-btn:hover {
            background: linear-gradient(135deg, #1e40af, #1d4ed8);
            transform: translateY(-2px);
            box-shadow: 0 15px 25px -5px rgba(30, 58, 138, 0.35);
        }

        .support-footer {
            margin-top: 40px;
            border-top: 1.5px solid var(--border);
            padding-top: 25px;
            text-align: center;
        }

        .support-footer h3 {
            font-size: 1.1rem;
            color: #1e3a8a;
            margin-bottom: 12px;
            font-weight: 700;
        }

        .support-contacts {
            display: flex;
            justify-content: center;
            gap: 30px;
            flex-wrap: wrap;
        }

        .support-item {
            font-size: 0.95rem;
            color: var(--text-muted);
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .support-item a {
            color: #1e3a8a;
            text-decoration: none;
            transition: color 0.2s;
        }

        .support-item a:hover {
            color: #3b82f6;
            text-decoration: underline;
        }

        @media (max-width: 768px) {
            .form-grid { grid-template-columns: 1fr; }
            .form-group.full-width { grid-column: span 1; }
            .form-container { padding: 25px; }
            .support-contacts { flex-direction: column; gap: 10px; }
        }
    </style>
</head>
<body>

<div class="form-container">
    <div class="brand-header">
        <div class="brand-logo-text">TIC <span>TAC</span></div>
        <p>شركة تيك تاك لصيانة المباني والمقاولات العامة - دولة قطر</p>
    </div>

    <form id="jobForm" onsubmit="submitApplication(event)">
        
        <div class="section-title">المعلومات الأساسية</div>
        <div class="form-grid">
            <div class="form-group full-width">
                <label>الاسم الكامل</label>
                <input type="text" id="name" required placeholder="أدخل اسمك الثلاثي كما هو في الأوراق الرسمية">
            </div>

            <div class="form-group">
                <label>العمر</label>
                <input type="number" id="age" required placeholder="مثال: 32">
            </div>

            <div class="form-group">
                <label>الجنس</label>
                <select id="gender" required>
                    <option value="">اختر الجنس...</option>
                    <option value="ذكر">ذكر</option>
                    <option value="أنثى">أنثى</option>
                </select>
            </div>

            <div class="form-group">
                <label>الجنسية</label>
                <select id="nationality" required>
                    <option value="">اختر الجنسية...</option>
                    <option value="قطري">قطري</option>
                    <option value="مصري">مصري</option>
                    <option value="هندي">هندي</option>
                    <option value="باكستاني">باكستاني</option>
                    <option value="بنغلاديشي">بنغلاديشي</option>
                    <option value="نيبالي">نيبالي</option>
                    <option value="سوداني">سوداني</option>
                    <option value="سوري">سوري</option>
                    <option value="أردني">أردني</option>
                    <option value="فلسطيني">فلسطيني</option>
                    <option value="لبناني">لبناني</option>
                    <option value="يمني">يمني</option>
                    <option value="فلبيني">فلبيني</option>
                    <option value="سريلانكي">سريلانكي</option>
                    <option value="تونسى">تونسى</option>
                    <option value="مغربي">مغربي</option>
                    <option value="جزائري">جزائري</option>
                    <option value="أخرى">أخرى</option>
                </select>
            </div>
        </div>

        <div class="section-title">بيانات التواصل</div>
        <div class="form-grid">
            <div class="form-group">
                <label>رقم الهاتف / واتساب (مع رمز الدولة)</label>
                <input type="text" id="phone" required placeholder="+974 xxxxxxxx">
            </div>

            <div class="form-group">
                <label>البريد الإلكتروني</label>
                <input type="email" id="email" required placeholder="name@example.com">
            </div>
        </div>

        <div class="section-title">المسمى الوظيفي والتخصصات</div>
        <div class="form-grid">
            <div class="form-group full-width">
                <label>اختر الوظيفة المستهدفة (تشمل الإدارية، الهندسية، الفنية، والعمالية)</label>
                <select id="position" required>
                    <option value="">اختر التخصص الوظيفي...</option>
                    <option value="مدير مشروع (مقاولات)">مدير مشروع (مقاولات)</option>
                    <option value="مدير إنشاءات وصيانة عامة">مدير إنشاءات وصيانة عامة</option>
                    <option value="مهندس تخطيط ومتابعة (Planning Engineer)">مهندس تخطيط ومتابعة (Planning Engineer)</option>
                    <option value="مهندس عقود وكميات (QS)">مهندس عقود وكميات (QS)</option>
                    <option value="مهندس موقع تنفيذي (Civil/MEP)">مهندس موقع تنفيذي (Civil/MEP)</option>
                    <option value="مهندس ألامن والسلامة (HSE Engineer)">مهندس الأمن والسلامة (HSE Engineer)</option>
                    <option value="مسؤول المشتريات واللوجستيات">مسؤول المشتريات واللوجستيات</option>
                    <option value="محاسب مالي وإداري">محاسب مالي وإداري</option>
                    <option value="مسؤول موارد بشرية وعلاقات حكومية (مندوب)">مسؤول موارد بشرية وعلاقات حكومية (مندوب)</option>
                    <option value="مشرف صيانة عامة (Superintendent)">مشرف صيانة عامة (Superintendent)</option>
                    <option value="مراقب عمال (فورمان عام)">مراقب عمال (فورمان عام)</option>
                    <option value="فني كهرباء مباني وكابلات">فني كهرباء مباني وكابلات</option>
                    <option value="فني تكييف وتبريد (HVAC)">فني تكييف وتبريد (HVAC)</option>
                    <option value="فني سباكة وصحي">فني سباكة وصحي</option>
                    <option value="فني لحام وتشكيل معادن">فني لحام وتشكيل معادن</option>
                    <option value="فني نجارة وأبواب">فني نجارة وأبواب</option>
                    <option value="فني دهانات وديكور">فني دهانات وديكور</option>
                    <option value="فني جبس بورد وتزيين">فني جبس بورد وتزيين</option>
                    <option value="فني ألمنيوم وواجهات زجاجية">فني ألمنيوم وواجهات زجاجية</option>
                    <option value="فني بلاط ورخام (سيراميك)">فني بلاط ورخام (سيراميك)</option>
                    <option value="فني مباني ولياسة (طوب وبلاستر)">فني مباني ولياسة (طوب وبلاستر)</option>
                    <option value="سائق معدات ثقيلة / رخصة قطرية">سائق معدات ثقيلة / رخصة قطرية</option>
                    <option value="سائق سيارة خفيفة / رخصة قطرية">سائق سيارة خفيفة / رخصة قطرية</option>
                    <option value="مساعد فني / عامل عادي">مساعد فني / عامل عادي</option>
                    <option value="أخرى">أخرى</option>
                </select>
            </div>

            <div class="form-group">
                <label>حالة الإقامة في قطر</label>
                <select id="iqamaStatus" required>
                    <option value="">اختر حالة الإقامة...</option>
                    <option value="إقامة قابلة للتحويل مع تصريح">إقامة قابلة للتحويل مع تصريح</option>
                    <option value="إقامة حرة / سارية">إقامة حرة / سارية</option>
                    <option value="زيارة / تأشيرة مؤقتة">زيارة / تأشيرة مؤقتة</option>
                    <option value="خارج الدولة (تأشيرة جديدة)">خارج الدولة (تأشيرة جديدة)</option>
                </select>
            </div>

            <div class="form-group">
                <label>رخصة القيادة</label>
                <select id="licenseStatus" required>
                    <option value="">اختر نوع الرخصة...</option>
                    <option value="رخصة قيادة قطرية خفيفة سارية">رخصة قيادة قطرية خفيفة سارية</option>
                    <option value="رخصة قيادة قطرية ثقيلة / معدات">رخصة قيادة قطرية ثقيلة / معدات</option>
                    <option value="رخصة دولية / خليجية">رخصة دولية / خليجية</option>
                    <option value="بدون رخصة قيادة">بدون رخصة قيادة</option>
                </select>
            </div>

            <div class="form-group">
                <label>توفر السيارة</label>
                <select id="hasCar" required>
                    <option value="">هل تمتلك سيارة خاصة؟</option>
                    <option value="نعم، أمتلك سيارة خاصة">نعم، أمتلك سيارة خاصة</option>
                    <option value="لا، لا أمتلك سيارة">لا، لا أمتلك سيارة</option>
                </select>
            </div>

            <div class="form-group">
                <label>السيرة الذاتية (CV)</label>
                <div class="file-upload-wrapper">
                    <span class="file-upload-text" id="fileNameDisplay">اختر ملف السيرة الذاتية (PDF, DOC)</span>
                    <input type="file" id="cvFile" accept=".pdf,.doc,.docx" onchange="updateFileName(this)">
                </div>
            </div>

            <div class="form-group full-width">
                <label>نبذة عن الخبرة السابقة</label>
                <textarea id="experience" rows="3" placeholder="اكتب ملخص سريع لخبراتك السابقة في قطاع المقاولات والصيانة..."></textarea>
            </div>
        </div>

        <button type="submit" class="submit-btn" id="submitBtn">إرسال الطلب الآن</button>
    </form>

    <div class="support-footer">
        <h3>للتواصل والدعم الفني</h3>
        <div class="support-contacts">
            <div class="support-item">
                <span>📞 الهاتف / واتساب:</span>
                <a href="tel:66608077">66608077</a>
            </div>
            <div class="support-item">
                <span>✉️ البريد الإلكتروني:</span>
                <a href="mailto:Tictac.qatar@gmail.com">Tictac.qatar@gmail.com</a>
            </div>
        </div>
    </div>
</div>

<script>
    const WEB_APP_URL = 'ضع_رابط_الـ_Web_App_هنا';

    function updateFileName(input) {
        const display = document.getElementById('fileNameDisplay');
        if (input.files.length > 0) {
            display.textContent = "تم إرفاق الملف: " + input.files[0].name;
            display.style.color = "#1e3a8a";
            display.style.fontWeight = "700";
        }
    }

    async function submitApplication(e) {
        e.preventDefault();
        const btn = document.getElementById('submitBtn');
        btn.disabled = true;
        btn.textContent = 'جاري إرسال الطلب...';

        const fileInput = document.getElementById('cvFile');
        let cvData = '';
        let cvName = '';
        if (fileInput.files.length > 0) {
            const file = fileInput.files[0];
            cvName = file.name;
            cvData = await new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result);
                reader.readAsDataURL(file);
            });
        }

        const emailVal = document.getElementById('email').value;
        const phoneVal = document.getElementById('phone').value;
        const contactInfo = `الهاتف: ${phoneVal} | الإيميل: ${emailVal}`;
        const qatarDetails = `الإقامة: ${document.getElementById('iqamaStatus').value} | الرخصة: ${document.getElementById('licenseStatus').value} | السيارة: ${document.getElementById('hasCar').value}`;

        const newApplicant = {
            name: document.getElementById('name').value,
            age: document.getElementById('age').value,
            gender: document.getElementById('gender').value,
            nationality: document.getElementById('nationality').value,
            phone: contactInfo, 
            position: document.getElementById('position').value,
            experience: document.getElementById('experience').value,
            qatarId: qatarDetails,
            cvData: cvData,
            cvName: cvName,
            date: new Date().toISOString()
        };

        try {
            await fetch(WEB_APP_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify(newApplicant)
            });
            alert('تم إرسال طلبك بنجاح إلى شركة TIC TAC لصيانة المباني!');
            document.getElementById('jobForm').reset();
            document.getElementById('fileNameDisplay').textContent = 'اختر ملف السيرة الذاتية (PDF, DOC)';
            document.getElementById('fileNameDisplay').style.color = 'var(--text-muted)';
        } catch (error) {
            alert('حدث خطأ أثناء الإرسال، يرجى المحاولة لاحقاً.');
        } finally {
            btn.disabled = false;
            btn.textContent = 'إرسال الطلب الآن';
        }
    }
</script>

</body>
</html>
