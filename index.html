<!DOCTYPE html>
<html lang="ar" dir="rtl" id="htmlTag">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tic tac for building maintenance</title>
    <!-- استدعاء خط Lusail Plus أو خطوط بديلة مدعومة -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #1e3a8a;
            --accent: #2563eb;
            --bg-gradient: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #cbd5e1;
            --radius: 14px;
        }
        body {
            font-family: 'Lusail Plus', 'Tajawal', 'Plus Jakarta Sans', sans-serif;
            background: var(--bg-gradient);
            color: var(--text-main);
            margin: 0;
            padding: 20px 10px;
            min-height: 100vh;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.9);
        }
        /* شريط علوي للعنوان وزر اللغات الثلاثة */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #f1f5f9;
            padding-bottom: 15px;
            margin-bottom: 25px;
            flex-wrap: wrap;
            gap: 15px;
        }
        .title-area h1 {
            font-size: 14pt;
            margin: 0 0 4px 0;
            color: var(--primary);
            font-weight: 700;
        }
        .title-area p {
            font-size: 8.5pt;
            margin: 0;
            color: var(--text-muted);
        }
        .lang-switcher {
            display: flex;
            gap: 5px;
            background: #f1f5f9;
            padding: 4px;
            border-radius: 8px;
        }
        .lang-btn {
            background: transparent;
            color: var(--text-muted);
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 9pt;
            font-weight: 600;
            transition: all 0.2s;
        }
        .lang-btn.active {
            background: var(--primary);
            color: #fff;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-bottom: 20px;
        }
        .form-group-full {
            grid-column: span 2;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 0;
        }
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 9.5pt;
            color: var(--text-main);
        }
        input, select, textarea {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 9.5pt;
            background: #f8fafc;
            box-sizing: border-box;
            font-family: inherit;
        }
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--accent);
            background: #fff;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }
        .radio-box {
            background: #f8fafc;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px 15px;
        }
        .radio-group {
            display: flex;
            gap: 25px;
            margin-top: 8px;
        }
        .radio-group label {
            font-weight: normal;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            margin-bottom: 0;
        }
        .submit-btn {
            background: var(--primary);
            color: white;
            border: none;
            width: 100%;
            padding: 14px;
            border-radius: 8px;
            font-size: 11pt;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            grid-column: span 2;
            font-family: inherit;
        }
        .submit-btn:hover {
            background: var(--accent);
        }
        .contact-footer {
            text-align: center;
            margin-top: 25px;
            padding-top: 15px;
            border-top: 1px solid #f1f5f9;
            font-size: 10pt;
            color: var(--text-muted);
        }
        .contact-footer a {
            color: var(--primary);
            font-weight: bold;
            text-decoration: none;
        }
        .success-msg {
            display: none;
            background: #d1fae5;
            color: #065f46;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            margin-top: 20px;
            font-weight: 600;
            grid-column: span 2;
        }
        @media(max-width: 768px) {
            .form-grid { grid-template-columns: 1fr; }
            .form-group-full { grid-column: span 1; }
            .submit-btn { grid-column: span 1; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="top-bar">
        <div class="title-area">
            <h1 id="mainTitle">tic tac for building maintenance</h1>
            <p id="subTitle">بوابة طلبات التوظيف والمشاركة التشغيلية</p>
        </div>
        <!-- أزرار تبديل اللغات الثلاثة -->
        <div class="lang-switcher">
            <button class="lang-btn active" onclick="setLanguage('ar')" id="btnAr">عربي</button>
            <button class="lang-btn" onclick="setLanguage('en')" id="btnEn">English</button>
            <button class="lang-btn" onclick="setLanguage('ur')" id="btnUr">اردو</button>
        </div>
    </div>

    <form id="jobForm" onsubmit="handleSubmit(event)" style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px;">
        
        <div class="form-group">
            <label id="lblName">الاسم الكامل</label>
            <input type="text" id="fullName" required placeholder="أدخل الاسم الكامل">
        </div>

        <div class="form-group">
            <label id="lblNationality">الجنسية</label>
            <select id="nationality" required>
                <option value="">اختر الجنسية</option>
                <option value="Egyptian">مصري (Egyptian)</option>
                <option value="Indian">هندي (Indian)</option>
                <option value="Nepalese">نيبالي (Nepalese)</option>
                <option value="Pakistani">باكستاني (Pakistani)</option>
                <option value="Bangladeshi">بنجلاديشي (Bangladeshi)</option>
                <option value="Filipino">فلبيني (Filipino)</option>
                <option value="Sri Lankan">سريلانكي (Sri Lankan)</option>
                <option value="Sudanese">سوداني (Sudanese)</option>
                <option value="Syrian">سوري (Syrian)</option>
                <option value="Jordanian">أردني (Jordanian)</option>
                <option value="Other">جنسية أخرى (Other)</option>
            </select>
        </div>

        <div class="form-group">
            <label id="lblPhone">رقم التواصل</label>
            <input type="tel" id="phone" required placeholder="+974 XXXXXXXX">
        </div>

        <div class="form-group">
            <label id="lblPosition">الوظيفة المتقدم لها</label>
            <select id="position" required>
                <option value="">اختر الوظيفة المناسبة</option>
                <optgroup label="المهندسون والإدارة (Engineers & Management)">
                    <option value="Project Manager">مدير مشروع (Project Manager)</option>
                    <option value="Site Engineer">مهندس موقع (Site Engineer)</option>
                    <option value="MEP Engineer">مهندس ميكانيكا وكهرباء (MEP Engineer)</option>
                    <option value="Civil Engineer">مهندس مدني (Civil Engineer)</option>
                    <option value="Quantity Surveyor">مسح كميات (Quantity Surveyor)</option>
                    <option value="Safety Officer">مسؤول سلامة واحة (HSE Officer)</option>
                </optgroup>
                <optgroup label="المشرفون والفنيون (Supervisors & Technicians)">
                    <option value="General Supervisor">مشرف عام (General Supervisor)</option>
                    <option value="Maintenance Supervisor">مشرف صيانة (Maintenance Supervisor)</option>
                    <option value="Electrician">فني كهرباء (Electrician)</option>
                    <option value="Plumber">فني سباكة وصحي (Plumber)</option>
                    <option value="HVAC Technician">فني تكييف وتبريد (HVAC Technician)</option>
                    <option value="Gypsum Board Tech">فني جبس بورد وديكور (Gypsum Board Technician)</option>
                    <option value="Painter">فني دهان وديكور (Painter)</option>
                    <option value="Mason">فني بناء ومحارة (Mason / Plasterer)</option>
                    <option value="Carpenter">نجار مباني (Carpenter)</option>
                    <option value="Welder">لحام حديد ومعدات (Welder / Fabricator)</option>
                </optgroup>
                <optgroup label="العمالة المهنية وعمال المقاولات (General Labors)">
                    <option value="Building Maintenance Worker">عامل صيانة مباني (Building Maintenance Worker)</option>
                    <option value="General Construction Laborer">عامل مقاولات عامة (General Laborer)</option>
                    <option value="Helper">مساعد فني (Helper / Assistant)</option>
                    <option value="Driver">سائق رخصة عمومي/خفيف (Driver)</option>
                </optgroup>
            </select>
        </div>

        <div class="form-group-full">
            <label id="lblExp">نبذة مختصرة عن الخبرات السابقة</label>
            <textarea id="experience" rows="3" placeholder="اكتب نبذة عن خبرتك في مجال المقاولات والصيانة..."></textarea>
        </div>

        <div class="form-group-full">
            <label id="lblCV">رفع السيرة الذاتية (CV / Resume)</label>
            <input type="file" id="cvFile" accept=".pdf,.doc,.docx">
        </div>

        <div class="form-group">
            <div class="radio-box">
                <label id="lblQatarID">هل لديك إقامة قطرية؟</label>
                <div class="radio-group">
                    <label><input type="radio" name="qatarId" value="Yes" required> <span id="yes1">نعم</span></label>
                    <label><input type="radio" name="qatarId" value="No"> <span id="no1">لا</span></label>
                </div>
            </div>
        </div>

        <div class="form-group">
            <div class="radio-box">
                <label id="lblLicense">هل لديك رخصة قيادة قطرية؟</label>
                <div class="radio-group">
                    <label><input type="radio" name="license" value="Yes" required> <span id="yes2">نعم</span></label>
                    <label><input type="radio" name="license" value="No"> <span id="no2">لا</span></label>
                </div>
            </div>
        </div>

        <div class="form-group-full">
            <div class="radio-box">
                <label id="lblCar">هل لديك سيارة خاصة؟</label>
                <div class="radio-group">
                    <label><input type="radio" name="car" value="Yes" required> <span id="yes3">نعم</span></label>
                    <label><input type="radio" name="car" value="No"> <span id="no3">لا</span></label>
                </div>
            </div>
        </div>

        <button type="submit" class="submit-btn" id="btnSubmit">إرسال الطلب</button>
        <div id="successMsg" class="success-msg">تم إرسال الطلب بنجاح!</div>
    </form>

    <div class="contact-footer" id="contactFooter">
        للتواصل والاستفسار: <a href="tel:66608077">66608077</a> (اتصال أو واتساب)
    </div>
</div>

<script>
    const translations = {
        ar: {
            subTitle: "بوابة طلبات التوظيف والمشاركة التشغيلية",
            lblName: "الاسم الكامل",
            phName: "أدخل الاسم الكامل",
            lblNationality: "الجنسية",
            selNat: "اختر الجنسية",
            lblPhone: "رقم التواصل",
            lblPosition: "الوظيفة المتقدم لها",
            selPos: "اختر الوظيفة المناسبة",
            lblExp: "نبذة مختصرة عن الخبرات السابقة",
            phExp: "اكتب نبذة عن خبرتك في مجال المقاولات والصيانة...",
            lblCV: "رفع السيرة الذاتية (CV / Resume)",
            lblQatarID: "هل لديك إقامة قطرية؟",
            lblLicense: "هل لديك رخصة قيادة قطرية؟",
            lblCar: "هل لديك سيارة خاصة؟",
            yes: "نعم",
            no: "لا",
            btnSubmit: "إرسال الطلب",
            success: "تم إرسال الطلب بنجاح!",
            footer: 'للتواصل والاستفسار: <a href="tel:66608077">66608077</a> (اتصال أو واتساب)'
        },
        en: {
            subTitle: "Job & Operational Partnership Portal",
            lblName: "Full Name",
            phName: "Enter full name",
            lblNationality: "Nationality",
            selNat: "Select Nationality",
            lblPhone: "Contact Number",
            lblPosition: "Position Applied For",
            selPos: "Select Position",
            lblExp: "Brief Experience",
            phExp: "Briefly describe your experience...",
            lblCV: "Upload CV / Resume",
            lblQatarID: "Qatari Residence?",
            lblLicense: "Qatari Driving License?",
            lblCar: "Private Car?",
            yes: "Yes",
            no: "No",
            btnSubmit: "Submit Application",
            success: "Application submitted successfully!",
            footer: 'Contact us: <a href="tel:66608077">66608077</a> (Call or WhatsApp)'
        },
        ur: {
            subTitle: "نوکری اور شراکت داری کا پورٹل",
            lblName: "पूरा नाम (Full Name)",
            phName: "اپنا پورا نام درج کریں",
            lblNationality: "قومیت (Nationality)",
            selNat: "قومیت منتخب کریں",
            lblPhone: "رابطہ نمبر (Phone Number)",
            lblPosition: "درخواست کردہ عہدہ (Position)",
            selPos: "عہدہ منتخب کریں",
            lblExp: "تجربہ کا مختصر خلاصہ",
            phExp: "اپنے تجربے کے بارے میں لکھیں...",
            lblCV: "سی وی اپ لوڈ کریں (CV Upload)",
            lblQatarID: "قطری اقامہ ہے؟",
            lblLicense: "قطری ڈرائیونگ لائسنس ہے؟",
            lblCar: "اپنی گاڑی ہے؟",
            yes: "ہاں (Yes)",
            no: "نہیں (No)",
            btnSubmit: "درخواست جمع کروائیں",
            success: "درخواست کامیابی سے جمع ہو گئی!",
            footer: 'رابطہ کریں: <a href="tel:66608077">66608077</a> (کال یا واٹس ایپ)'
        }
    };

    function setLanguage(lang) {
        document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
        if(lang === 'ar') {
            document.getElementById('htmlTag').setAttribute('lang', 'ar');
            document.getElementById('htmlTag').setAttribute('dir', 'rtl');
            document.getElementById('btnAr').classList.add('active');
        } else if(lang === 'en') {
            document.getElementById('htmlTag').setAttribute('lang', 'en');
            document.getElementById('htmlTag').setAttribute('dir', 'ltr');
            document.getElementById('btnEn').classList.add('active');
        } else {
            document.getElementById('htmlTag').setAttribute('lang', 'ur');
            document.getElementById('htmlTag').setAttribute('dir', 'rtl');
            document.getElementById('btnUr').classList.add('active');
        }

        const t = translations[lang];
        document.getElementById('subTitle').innerText = t.subTitle;
        document.getElementById('lblName').innerText = t.lblName;
        document.getElementById('fullName').placeholder = t.phName;
        document.getElementById('lblNationality').innerText = t.lblNationality;
        document.getElementById('lblPhone').innerText = t.lblPhone;
        document.getElementById('lblPosition').innerText = t.lblPosition;
        document.getElementById('lblExp').innerText = t.lblExp;
        document.getElementById('experience').placeholder = t.phExp;
        document.getElementById('lblCV').innerText = t.lblCV;
        document.getElementById('lblQatarID').innerText = t.lblQatarID;
        document.getElementById('lblLicense').innerText = t.lblLicense;
        document.getElementById('lblCar').innerText = t.lblCar;
        document.getElementById('yes1').innerText = t.yes; document.getElementById('no1').innerText = t.no;
        document.getElementById('yes2').innerText = t.yes; document.getElementById('no2').innerText = t.no;
        document.getElementById('yes3').innerText = t.yes; document.getElementById('no3').innerText = t.no;
        document.getElementById('btnSubmit').innerText = t.btnSubmit;
        document.getElementById('successMsg').innerText = t.success;
        document.getElementById('contactFooter').innerHTML = t.footer;
    }

    function handleSubmit(e) {
        e.preventDefault();
        const msg = document.getElementById('successMsg');
        msg.style.display = 'block';
        setTimeout(() => {
            msg.style.display = 'none';
            document.getElementById('jobForm').reset();
        }, 4000);
    }
</script>
</body>
</html>
