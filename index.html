<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نموذج طلب التوظيف - TIC TAC</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap');

        :root {
            --primary: #0f172a;
            --accent: #2563eb;
            --bg-body: #f1f5f9;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --radius: 16px;
            --shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.05);
        }

        body {
            font-family: 'Tajawal', sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            margin: 0;
            padding: 30px 20px;
        }

        .form-wrapper {
            max-width: 800px;
            margin: 0 auto;
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            padding: 30px;
        }

        .form-header {
            text-align: center;
            border-bottom: 2px solid var(--border);
            padding-bottom: 20px;
            margin-bottom: 25px;
        }

        .form-header h1 {
            font-size: 1.5rem;
            margin: 0 0 10px 0;
            color: var(--primary);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-main);
        }

        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 12px 15px;
            border: 1.5px solid var(--border);
            border-radius: 10px;
            font-size: 0.95rem;
            background: #fff;
            font-family: inherit;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
            border-color: var(--accent);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .btn-submit {
            background: var(--accent);
            color: #fff;
            border: none;
            width: 100%;
            padding: 14px;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-submit:hover {
            background: #1d4ed8;
        }

        @media(max-width: 768px) {
            .form-row { grid-template-columns: 1fr; gap: 0; }
        }
    </style>
</head>
<body>

<div class="form-wrapper">
    <div class="form-header">
        <h1>نموذج تقديم الوظائف - TIC TAC</h1>
        <p>يرجى تعبئة البيانات أدناه بدقة لإرسال طلبك</p>
    </div>

    <form id="applicantForm" onsubmit="saveApplicant(event)">
        <div class="form-row">
            <div class="form-group">
                <label>الاسم الكامل</label>
                <input type="text" id="appName" required placeholder="أدخل اسمك الكامل">
            </div>
            <div class="form-group">
                <label>العمر</label>
                <input type="number" id="appAge" required min="18" max="70" placeholder="أدخل العمر">
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label>الجنس</label>
                <select id="appGender" required>
                    <option value="">اختر الجنس</option>
                    <option value="ذكر">ذكر</option>
                    <option value="أنثى">أنثى</option>
                </select>
            </div>
            <div class="form-group">
                <label>الجنسية</label>
                <select id="appNationality" required>
                    <option value="">اختر الجنسية</option>
                    <option value="Egyptian">مصري</option>
                    <option value="Indian">هندي</option>
                    <option value="Nepalese">نيبالي</option>
                    <option value="Pakistani">باكستاني</option>
                    <option value="Bangladeshi">بنجلاديشي</option>
                    <option value="Filipino">فلبيني</option>
                </select>
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label>رقم التواصل</label>
                <input type="tel" id="appPhone" required placeholder="مثال: 50000000">
            </div>
            <div class="form-group">
                <label>الوظيفة المطلوبة</label>
                <select id="appPosition" required>
                    <option value="">اختر الوظيفة</option>
                    <option value="Electrician">فني كهرباء</option>
                    <option value="Plumber">فني سباكة</option>
                    <option value="Site Engineer">مهندس موقع</option>
                    <option value="Project Manager">مدير مشروع</option>
                </select>
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label>الحالة (إقامة / رخصة / سيارة)</label>
                <div style="display: flex; gap: 10px;">
                    <select id="appQatarId">
                        <option value="إقامة سارية">إقامة سارية</option>
                        <option value="إقامة منتهية">إقامة منتهية</option>
                    </select>
                    <select id="appLicense">
                        <option value="رخصة قيادة">رخصة قيادة</option>
                        <option value="بدون رخصة">بدون رخصة</option>
                    </select>
                    <select id="appCar">
                        <option value="يوجد سيارة">يوجد سيارة</option>
                        <option value="بدون سيارة">بدون سيارة</option>
                    </select>
                </div>
            </div>
            <div class="form-group">
                <label>رفع السيرة الذاتية (CV)</label>
                <input type="file" id="appCv" accept=".pdf,.doc,.docx">
            </div>
        </div>

        <div class="form-group">
            <label>نبذة عن الخبرة</label>
            <textarea id="appExperience" rows="3" placeholder="اكتب نبذة مختصرة عن خبرتك السابقة..."></textarea>
        </div>

        <button type="submit" class="btn-submit">إرسال الطلب</button>
    </form>
</div>

<script>
    function saveApplicant(event) {
        event.preventDefault();

        const name = document.getElementById('appName').value;
        const age = document.getElementById('appAge').value;
        const gender = document.getElementById('appGender').value;
        const nationality = document.getElementById('appNationality').value;
        const phone = document.getElementById('appPhone').value;
        const position = document.getElementById('appPosition').value;
        const qatarId = document.getElementById('appQatarId').value;
        const license = document.getElementById('appLicense').value;
        const car = document.getElementById('appCar').value;
        const experience = document.getElementById('appExperience').value;
        
        const cvFileInput = document.getElementById('appCv');
        
        function finalizeSave(cvData = '', cvName = '') {
            const newApplicant = {
                name, age, gender, nationality, phone, position, qatarId, license, car, experience,
                cvData, cvName, status: ''
            };

            let applicants = JSON.parse(localStorage.getItem('ticTacApplicants')) || [];
            applicants.push(newApplicant);
            localStorage.setItem('ticTacApplicants', JSON.stringify(applicants));

            alert('تم إرسال طلبك بنجاح!');
            document.getElementById('applicantForm').reset();
        }

        if (cvFileInput.files && cvFileInput.files[0]) {
            const reader = new FileReader();
            reader.onload = function(e) {
                finalizeSave(e.target.result, cvFileInput.files[0].name);
            };
            reader.readAsDataURL(cvFileInput.files[0]);
        } else {
            finalizeSave();
        }
    }
</script>
</body>
</html>
