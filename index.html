<!DOCTYPE html>
<html lang="en" dir="ltr" id="htmlTag">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tic tac for building maintenance</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #1e3a8a;
            --accent: #2563eb;
            --bg-gradient: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #cbd5e1;
            --radius: 16px;
        }
        body {
            font-family: 'Plus Jakarta Sans', 'Amiri', sans-serif;
            background: var(--bg-gradient);
            color: var(--text-main);
            margin: 0;
            padding: 20px 15px;
            min-height: 100vh;
        }
        .container {
            max-width: 750px;
            margin: 0 auto;
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 30px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.8);
        }
        .header-flex {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #f1f5f9;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }
        .title-area h1 {
            font-size: 13pt;
            margin: 0 0 4px 0;
            color: var(--primary);
            font-weight: 700;
        }
        .title-area p {
            font-size: 8.5pt;
            margin: 0;
            color: var(--text-muted);
        }
        .lang-btn {
            background: var(--primary);
            color: #fff;
            border: none;
            padding: 5px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 8.5pt;
            font-weight: 600;
            white-space: nowrap;
        }
        .form-row {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
        }
        .form-group {
            flex: 1;
            margin-bottom: 15px;
        }
        .form-group-full {
            margin-bottom: 15px;
        }
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 6px;
            font-size: 9.5pt;
        }
        input, select, textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 9.5pt;
            background: #f8fafc;
            box-sizing: border-box;
        }
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--accent);
            background: #fff;
        }
        .radio-group-container {
            background: #f8fafc;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px 12px;
        }
        .radio-options {
            display: flex;
            gap: 20px;
            margin-top: 5px;
        }
        .radio-options label {
            font-weight: normal;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            cursor: pointer;
        }
        .submit-btn {
            background: var(--primary);
            color: white;
            border: none;
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            font-size: 10.5pt;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 10px;
        }
        .submit-btn:hover {
            background: var(--accent);
        }
        .contact-footer {
            text-align: center;
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid #f1f5f9;
            font-size: 9.5pt;
            color: var(--text-muted);
        }
        .contact-footer a {
            color: var(--primary);
            font-weight: bold;
            text-decoration: none;
        }
        .success-msg {
            display: none;
            background: #d1fae5;
            color: #065f46;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            margin-top: 15px;
            font-weight: 600;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-flex">
        <div class="title-area">
            <h1 id="mainTitle">tic tac for building maintenance</h1>
            <p id="subTitle">Job / Partnership Application Portal</p>
        </div>
        <button class="lang-btn" onclick="toggleLanguage()" id="langBtn">العربية</button>
    </div>

    <form id="jobForm" onsubmit="handleSubmit(event)">
        <div class="form-row">
            <div class="form-group">
                <label id="lblName">Full Name / الاسم</label>
                <input type="text" id="fullName" required placeholder="Enter full name">
            </div>
            <div class="form-group">
                <label id="lblNationality">Nationality / الجنسية</label>
                <select id="nationality" required>
                    <option value="">Select Nationality / اختر الجنسية</option>
                    <option value="Egyptian">مصري (Egyptian)</option>
                    <option value="Indian">هندي (Indian)</option>
                    <option value="Nepalese">نيبالي (Nepalese)</option>
                    <option value="Pakistani">باكستاني (Pakistani)</option>
                    <option value="Bangladeshi">بنجلاديشي (Bangladeshi)</option>
                    <option value="Filipino">فلبيني (Filipino)</option>
                    <option value="Sri Lankan">سريلانكي (Sri Lankan)</option>
                    <option value="Sudanese">سوداني (Sudanese)</option>
                    <option value="Syrian">سوري (Syrian)</option>
                    <option value="Jordanian">أردني (Jordanian)</option>
                    <option value="Other">أخري (Other)</option>
                </select>
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label id="lblPhone">Contact Number / رقم التواصل</label>
                <input type="tel" id="phone" required placeholder="+974 XXXXXXXX">
            </div>
            <div class="form-group">
                <label id="lblPosition">Position / الوظيفة المطلوبة</label>
                <select id="position" required>
                    <option value="">Select Position / اختر الوظيفة</option>
                    <!-- مهندسين ومسؤولين -->
                    <option value="Project Manager">مدير مشروع (Project Manager)</option>
                    <option value="Site Engineer">مهندس موقع (Site Engineer)</option>
                    <option value="MEP Engineer">مهندس MEP</option>
                    <option value="General Supervisor">مشرف عام (General Supervisor)</option>
                    <option value="Maintenance Supervisor">مشرف صيانة (Maintenance Supervisor)</option>
                    <!-- فنيين وعمال تخصصيين -->
                    <option value="Electrician">فني كهرباء (Electrician)</option>
                    <option value="Plumber">فني سباكة (Plumber)</option>
                    <option value="Gypsum Board Technician">فني جبس بورد (Gypsum Board Technician)</option>
                    <option value="HVAC Technician">فني تكييف (HVAC Technician)</option>
                    <option value="Painter">فني دهان وديكور (Painter)</option>
                    <!-- عمال مقاولات وعامة -->
                    <option value="Building Maintenance Worker">عامل صيانة مباني (Building Maintenance Worker)</option>
                    <option value="General Construction Laborer">عامل مقاولات عامة (General Construction Laborer)</option>
                </select>
            </div>
        </div>

        <div class="form-group-full">
            <label id="lblExp">Brief Experience / نبذة مختصره عن الخبرات</label>
            <textarea id="experience" rows="3" placeholder="Briefly describe your experience in maintenance/construction..."></textarea>
        </div>

        <div class="form-group-full">
            <label id="lblCV">Upload CV / رفع السيرة الذاتية (PDF / Word)</label>
            <input type="file" id="cvFile" accept=".pdf,.doc,.docx">
        </div>

        <div class="form-row">
            <div class="form-group">
                <div class="radio-group-container">
                    <label id="lblQatarID">Qatari Residence / إقامة قطرية؟</label>
                    <div class="radio-options">
                        <label><input type="radio" name="qatarId" value="Yes" required> <span id="txtYes1">Yes / نعم</span></label>
                        <label><input type="radio" name="qatarId" value="No"> <span id="txtNo1">No / لا</span></label>
                    </div>
                </div>
            </div>
            <div class="form-group">
                <div class="radio-group-container">
                    <label id="lblLicense">Qatari Driving License / رخصة سواقه قطرية؟</label>
                    <div class="radio-options">
                        <label><input type="radio" name="license" value="Yes" required> <span id="txtYes2">Yes / نعم</span></label>
                        <label><input type="radio" name="license" value="No"> <span id="txtNo2">No / لا</span></label>
                    </div>
                </div>
            </div>
        </div>

        <div class="form-group-full">
            <div class="radio-group-container">
                <label id="lblCar">Private Car / سيارة خاصة؟</label>
                <div class="radio-options">
                    <label><input type="radio" name="car" value="Yes" required> <span id="txtYes3">Yes / نعم</span></label>
                    <label><input type="radio" name="car" value="No"> <span id="txtNo3">No / لا</span></label>
                </div>
            </div>
        </div>

        <button type="submit" class="submit-btn" id="btnSubmit">Submit Application / إرسال الطلب</button>
    </form>

    <div id="successMsg" class="success-msg">Application submitted successfully! / تم إرسال الطلب بنجاح!</div>

    <div class="contact-footer" id="contactFooter">
        للتواصل والاستفسار: <a href="tel:66608077">66608077</a> (اتصال أو واتساب)
    </div>
</div>

<script>
    let currentLang = 'en';
    function toggleLanguage() {
        const html = document.getElementById('htmlTag');
        if (currentLang === 'en') {
            currentLang = 'ar';
            html.setAttribute('lang', 'ar');
            html.setAttribute('dir', 'rtl');
            html.style.fontFamily = "'Amiri', sans-serif";
            document.getElementById('mainTitle').innerText = 'tic tac for building maintenance';
            document.getElementById('subTitle').innerText = 'بوابة طلبات التوظيف والمشاركة';
            document.getElementById('langBtn').innerText = 'English';
            document.getElementById('lblName').innerText = 'الاسم الكامل';
            document.getElementById('lblNationality').innerText = 'الجنسية';
            document.getElementById('lblPhone').innerText = 'رقم التواصل';
            document.getElementById('lblPosition').innerText = 'الوظيفة المطلوبة';
            document.getElementById('lblExp').innerText = 'نبذة مختصره عن الخبرات';
            document.getElementById('lblCV').innerText = 'مكان السيرة الذاتية (رفع الملف)';
            document.getElementById('lblQatarID').innerText = 'هل لديك إقامة قطرية؟';
            document.getElementById('lblLicense').innerText = 'هل لديك رخصة سواقة قطرية؟';
            document.getElementById('lblCar').innerText = 'هل لديك سيارة خاصة؟';
            document.getElementById('txtYes1').innerText = 'نعم'; document.getElementById('txtNo1').innerText = 'لا';
            document.getElementById('txtYes2').innerText = 'نعم'; document.getElementById('txtNo2').innerText = 'لا';
            document.getElementById('txtYes3').innerText = 'نعم'; document.getElementById('txtNo3').innerText = 'لا';
            document.getElementById('btnSubmit').innerText = 'إرسال الطلب';
            document.getElementById('successMsg').innerText = 'تم إرسال الطلب بنجاح!';
            document.getElementById('contactFooter').innerHTML = 'للتواصل والاستفسار: <a href="tel:66608077">66608077</a> (اتصال أو واتساب)';
        } else {
            currentLang = 'en';
            html.setAttribute('lang', 'en');
            html.setAttribute('dir', 'ltr');
            html.style.fontFamily = "'Plus Jakarta Sans', sans-serif";
            document.getElementById('mainTitle').innerText = 'tic tac for building maintenance';
            document.getElementById('subTitle').innerText = 'Job / Partnership Application Portal';
            document.getElementById('langBtn').innerText = 'العربية';
            document.getElementById('lblName').innerText = 'Full Name';
            document.getElementById('lblNationality').innerText = 'Nationality';
            document.getElementById('lblPhone').innerText = 'Contact Number';
            document.getElementById('lblPosition').innerText = 'Position Applied For';
            document.getElementById('lblExp').innerText = 'Brief Experience';
            document.getElementById('lblCV').innerText = 'Upload CV File';
            document.getElementById('lblQatarID').innerText = 'Qatari Residence?';
            document.getElementById('lblLicense').innerText = 'Qatari Driving License?';
            document.getElementById('lblCar').innerText = 'Private Car?';
            document.getElementById('txtYes1').innerText = 'Yes'; document.getElementById('txtNo1').innerText = 'No';
            document.getElementById('txtYes2').innerText = 'Yes'; document.getElementById('txtNo2').innerText = 'No';
            document.getElementById('txtYes3').innerText = 'Yes'; document.getElementById('txtNo3').innerText = 'No';
            document.getElementById('btnSubmit').innerText = 'Submit Application';
            document.getElementById('successMsg').innerText = 'Application submitted successfully!';
            document.getElementById('contactFooter').innerHTML = 'Contact us: <a href="tel:66608077">66608077</a> (Call or WhatsApp)';
        }
    }

    function handleSubmit(e) {
        e.preventDefault();
        const msg = document.getElementById('successMsg');
        msg.style.display = 'block';
        setTimeout(() => {
            msg.style.display = 'none';
            document.getElementById('jobForm').reset();
        }, 4000);
    }
</script>
</body>
</html>
