<!DOCTYPE html>
<html lang="en" dir="ltr" id="htmlTag">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tic tac for building maintenance</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #1e3a8a;
            --accent: #2563eb;
            --bg-gradient: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #cbd5e1;
            --radius: 18px;
        }
        body {
            font-family: 'Plus Jakarta Sans', 'Amiri', sans-serif;
            background: var(--bg-gradient);
            color: var(--text-main);
            margin: 0;
            padding: 30px 15px;
            min-height: 100vh;
        }
        .container {
            max-width: 700px;
            margin: 0 auto;
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.8);
        }
        .header-flex {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #f1f5f9;
            padding-bottom: 20px;
            margin-bottom: 25px;
        }
        .title-area h1 {
            font-size: 15pt; /* تم تصغير العنوان ليترك مساحة كافية */
            margin: 0 0 4px 0;
            color: var(--primary);
            font-weight: 700;
            white-space: normal;
        }
        .title-area p {
            font-size: 9pt;
            margin: 0;
            color: var(--text-muted);
        }
        .lang-btn {
            background: var(--primary);
            color: #fff;
            border: none;
            padding: 6px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 9pt;
            font-weight: 600;
            transition: background 0.2s;
            white-space: nowrap;
        }
        .lang-btn:hover {
            background: var(--accent);
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 10pt;
        }
        input, select, textarea {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid var(--border);
            border-radius: 10px;
            font-size: 10pt;
            background: #f8fafc;
            box-sizing: border-box;
        }
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--accent);
            background: #fff;
        }
        .submit-btn {
            background: var(--primary);
            color: white;
            border: none;
            width: 100%;
            padding: 14px;
            border-radius: 10px;
            font-size: 11pt;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        .submit-btn:hover {
            background: var(--accent);
        }
        .success-msg {
            display: none;
            background: #d1fae5;
            color: #065f46;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            margin-top: 15px;
            font-weight: 600;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-flex">
        <div class="title-area">
            <h1 id="mainTitle">tic tac for building maintenance</h1>
            <p id="subTitle">Job Application Portal</p>
        </div>
        <button class="lang-btn" onclick="toggleLanguage()" id="langBtn">العربية</button>
    </div>

    <form id="jobForm" onsubmit="handleSubmit(event)">
        <div class="form-group">
            <label id="lblName">Full Name</label>
            <input type="text" id="fullName" required placeholder="Enter your full name">
        </div>
        <div class="form-group">
            <label id="lblEmail">Email Address</label>
            <input type="email" id="email" required placeholder="name@example.com">
        </div>
        <div class="form-group">
            <label id="lblPosition">Position Applied For</label>
            <select id="position">
                <option value="Maintenance Technician">Maintenance Technician</option>
                <option value="HVAC Engineer">HVAC Engineer</option>
                <option value="Site Supervisor">Site Supervisor</option>
            </select>
        </div>
        <button type="submit" class="submit-btn" id="btnSubmit">Submit Application</button>
    </form>
    <div id="successMsg" class="success-msg">Application submitted successfully!</div>
</div>

<script>
    let currentLang = 'en';
    function toggleLanguage() {
        const html = document.getElementById('htmlTag');
        const mainTitle = document.getElementById('mainTitle');
        const subTitle = document.getElementById('subTitle');
        const langBtn = document.getElementById('langBtn');
        const lblName = document.getElementById('lblName');
        const lblEmail = document.getElementById('lblEmail');
        const lblPosition = document.getElementById('lblPosition');
        const btnSubmit = document.getElementById('btnSubmit');
        const successMsg = document.getElementById('successMsg');

        if (currentLang === 'en') {
            currentLang = 'ar';
            html.setAttribute('lang', 'ar');
            html.setAttribute('dir', 'rtl');
            html.style.fontFamily = "'Amiri', sans-serif";
            mainTitle.innerText = 'tic tac for building maintenance';
            subTitle.innerText = 'بوابة التقديم للوظائف';
            langBtn.innerText = 'English';
            lblName.innerText = 'الاسم الكامل';
            lblEmail.innerText = 'البريد الإلكتروني';
            lblPosition.innerText = 'الوظيفة المتقدم لها';
            btnSubmit.innerText = 'إرسال الطلب';
            successMsg.innerText = 'تم تقديم الطلب بنجاح!';
        } else {
            currentLang = 'en';
            html.setAttribute('lang', 'en');
            html.setAttribute('dir', 'ltr');
            html.style.fontFamily = "'Plus Jakarta Sans', sans-serif";
            mainTitle.innerText = 'tic tac for building maintenance';
            subTitle.innerText = 'Job Application Portal';
            langBtn.innerText = 'العربية';
            lblName.innerText = 'Full Name';
            lblEmail.innerText = 'Email Address';
            lblPosition.innerText = 'Position Applied For';
            btnSubmit.innerText = 'Submit Application';
            successMsg.innerText = 'Application submitted successfully!';
        }
    }

    function handleSubmit(e) {
        e.preventDefault();
        const successMsg = document.getElementById('successMsg');
        successMsg.style.display = 'block';
        setTimeout(() => {
            successMsg.style.display = 'none';
            document.getElementById('jobForm').reset();
        }, 4000);
    }
</script>
</body>
</html>
